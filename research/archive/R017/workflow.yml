name: R017 H017 Trading Filter

on:
  push:
    branches: [main]
    paths:
      - "research/active/R017_H017_FILTER/**"
      - "tests/test_r017_h017_filter.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/r017-h017-filter.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_r017_h017_filter.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run frozen R017
        env:
          PYTHONPATH: .
        run: python research/active/R017_H017_FILTER/r017_h017_filter.py
      - name: Verify 2026 isolation
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          for f in glob.glob("results/R017/*.parquet"):
              d=pd.read_parquet(f)
              if d.empty:
                  continue
              for col in ["timestamp_et","h017_time","entry_ts","exit_ts"]:
                  if col in d.columns:
                      ts=pd.to_datetime(d[col],utc=True,errors="coerce").dropna().dt.tz_convert("America/New_York")
                      if len(ts):
                          assert ts.dt.year.max()<=2025,(f,col,ts.dt.year.max())
          print("R017 verified: 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r017-h017-trading-filter
          path: results/R017/**
          retention-days: 30
