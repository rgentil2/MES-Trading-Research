name: R006 Volatility Compression research

on:
  push:
    branches: [main]
    paths:
      - "research/active/R006_VOL_COMPRESSION/**"
      - "src/research_utils.py"
      - "tests/test_r006_vol_compression.py"
      - "src/data_pipeline.py"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/r006-vol-compression.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_r006_vol_compression.py

      - name: Build dataset
        run: python -m src.data_pipeline

      - name: Run R006 development
        env:
          PYTHONPATH: .
        run: |
          python research/active/R006_VOL_COMPRESSION/r006_vol_compression.py \
            --start 2020-01-01 \
            --end 2024-12-31 \
            --output-dir results/R006/development_2020_2024

      - name: Verify holdout and entry cutoff
        run: |
          python - <<'PY'
          import pandas as pd
          e = pd.read_parquet("results/R006/development_2020_2024/events.parquet")
          ts = pd.to_datetime(e["timestamp_et"], utc=True).dt.tz_convert("America/New_York")
          minute = ts.dt.hour * 60 + ts.dt.minute
          assert ts.dt.year.max() <= 2024
          assert minute.min() >= 601
          assert minute.max() <= 690
          print("R006 isolation/cutoff verified")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r006-vol-compression-development-2020-2024
          path: |
            results/R006/development_2020_2024/SUMMARY.md
            results/R006/development_2020_2024/primary_hypothesis.csv
            results/R006/development_2020_2024/yearly_stability.csv
            results/R006/development_2020_2024/events.parquet
          retention-days: 30
