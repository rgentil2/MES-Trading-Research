name: R007 Efficient Momentum research

on:
  push:
    branches: [main]
    paths:
      - "research/active/R007_EFFICIENT_MOMENTUM/**"
      - "src/research_utils.py"
      - "tests/test_r007_efficient_momentum.py"
      - "src/data_pipeline.py"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/r007-efficient-momentum.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_r007_efficient_momentum.py

      - name: Build dataset
        run: python -m src.data_pipeline

      - name: Run R007 development
        env:
          PYTHONPATH: .
        run: |
          python research/active/R007_EFFICIENT_MOMENTUM/r007_efficient_momentum.py \
            --start 2020-01-01 \
            --end 2024-12-31 \
            --output-dir results/R007/development_2020_2024

      - name: Verify holdout and cutoff
        run: |
          python - <<'PY'
          import pandas as pd
          e = pd.read_parquet("results/R007/development_2020_2024/events.parquet")
          ts = pd.to_datetime(e["timestamp_et"], utc=True).dt.tz_convert("America/New_York")
          minute = ts.dt.hour * 60 + ts.dt.minute
          assert ts.dt.year.max() <= 2024
          assert minute.min() >= 586
          assert minute.max() <= 690
          print("R007 isolation/cutoff verified")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r007-efficient-momentum-development-2020-2024
          path: |
            results/R007/development_2020_2024/SUMMARY.md
            results/R007/development_2020_2024/primary_hypothesis.csv
            results/R007/development_2020_2024/yearly_stability.csv
            results/R007/development_2020_2024/side_breakdown.csv
            results/R007/development_2020_2024/events.parquet
          retention-days: 30
