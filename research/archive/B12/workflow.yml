name: B12 Strategy Architecture

on:
  push:
    branches: [main]
    paths:
      - "research/B12_STRATEGY_ARCHITECTURE_PRE_REGISTRATION.md"
      - "research/active/B12_STRATEGY_ARCHITECTURE/**"
      - "research/active/R063_FINAL_REGIME_ENGINE/**"
      - "research/archive/B05/**"
      - "research/archive/B11/**"
      - "research/archive/R017/**"
      - "tests/test_b12_strategy_architecture.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/b12-strategy-architecture.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_b12_strategy_architecture.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run frozen B12
        env:
          PYTHONPATH: .
        run: python research/active/B12_STRATEGY_ARCHITECTURE/b12_strategy_architecture.py
      - name: Verify 2026 isolation
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          for f in glob.glob("results/B12/*.parquet"):
              d=pd.read_parquet(f)
              if d.empty:
                  continue
              for col in ["block_end_ts","entry_clock_et","breakout_signal_ts"]:
                  if col in d.columns:
                      ts=pd.to_datetime(d[col],utc=True,errors="coerce").dropna().dt.tz_convert("America/New_York")
                      if len(ts):
                          assert ts.dt.year.max()<=2025,(f,col,ts.dt.year.max())
          print("B12 verified: 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b12-strategy-architecture
          path: results/B12/**
          retention-days: 30
