name: R011 Volume Impulse research

on:
  push:
    branches: [main]
    paths:
      - "research/active/R011_VOLUME_IMPULSE/**"
      - "src/research_utils.py"
      - "tests/test_r011_volume_impulse.py"
      - "src/data_pipeline.py"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/r011-volume-impulse.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_r011_volume_impulse.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run R011 development
        env:
          PYTHONPATH: .
        run: |
          python research/active/R011_VOLUME_IMPULSE/r011_volume_impulse.py \
            --start 2020-01-01 \
            --end 2024-12-31 \
            --output-dir results/R011/development_2020_2024
      - name: Verify holdout and cutoff
        run: |
          python - <<'PY'
          import pandas as pd
          e = pd.read_parquet("results/R011/development_2020_2024/events.parquet")
          ts = pd.to_datetime(e["timestamp_et"], utc=True).dt.tz_convert("America/New_York")
          minute = ts.dt.hour * 60 + ts.dt.minute
          assert ts.dt.year.max() <= 2024
          assert minute.min() >= 576
          assert minute.max() <= 690
          print("R011 isolation/cutoff verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r011-volume-impulse-development-2020-2024
          path: |
            results/R011/development_2020_2024/SUMMARY.md
            results/R011/development_2020_2024/primary_hypothesis.csv
            results/R011/development_2020_2024/yearly_stability.csv
            results/R011/development_2020_2024/side_breakdown.csv
            results/R011/development_2020_2024/events.parquet
          retention-days: 30
