project:
  timezone: America/New_York
  instrument: MES

data:
  raw_dir: data/raw
  processed_dir: data/processed
  raw_pattern: "MES ??-??.Last.txt"
  timestamp_timezone: UTC
  tick_size: 0.25
  rollover_policy: ninjatrader_implicit

costs:
  commission_round_trip_usd: 1.88
  slippage_round_trip_usd: 2.50
  total_round_trip_usd: 4.38

research:
  forward_horizons_minutes: [5, 10, 15, 30]
  session_start: "09:30"
  session_end: "16:00"
  entry_start: "09:30"
  entry_cutoff: "11:30"
  allow_exit_after_entry_cutoff: true

validation:
  development_start: "2020-01-01"
  development_end: "2024-12-31"
  validation_start: "2025-01-01"
  validation_end: "2025-12-31"
  pseudo_forward_start: "2026-01-01"
