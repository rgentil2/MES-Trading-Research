name: PDC NinjaTrader extra-date diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/pdc_nt_extra_diagnostic.py'
      - '.github/workflows/pdc-nt-extra-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow pyyaml scipy statsmodels
      - run: python research/pdc_nt_extra_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdc-nt-extra-diagnostic
          path: results/pdc_nt_extra_diagnostic/*
          if-no-files-found: error
