name: NQ V23 immutable objective complete generator, final reports and source reproducibility
on:
  push:
    paths:
      - 'research/nq/ninjatrader/NQNativeResearchRunnerV22.cs'
      - 'research/nq/ninjatrader/NQNativeConfigV23.cs'
      - 'research/nq/ninjatrader/NQNativeCompleteGeneratorV23.cs'
      - 'research/nq/ninjatrader/tests/NQNativeCompleteGeneratorV23Test.cs'
      - 'tools/nq-v23-research/NQResearchV23.csproj'
      - 'tools/nq-v23-research/NQNativeV23Console.cs'
      - '.github/workflows/nq-v23-complete-generator-qa.yml'
  pull_request:
    paths:
      - 'research/nq/ninjatrader/NQNativeResearchRunnerV22.cs'
      - 'research/nq/ninjatrader/NQNativeConfigV23.cs'
      - 'research/nq/ninjatrader/NQNativeCompleteGeneratorV23.cs'
      - 'research/nq/ninjatrader/tests/NQNativeCompleteGeneratorV23Test.cs'
      - 'tools/nq-v23-research/NQResearchV23.csproj'
      - 'tools/nq-v23-research/NQNativeV23Console.cs'
      - '.github/workflows/nq-v23-complete-generator-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-one-offline-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Compile exactly pinned explicit V11-V23 source modules without NinjaTrader
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/nq-v23-research/NQResearchV23.csproj --configuration Release --nologo
          dotnet run --project tools/nq-v23-research/NQResearchV23.csproj --no-build --configuration Release -- --version | grep S0.84_V23_COMPLETE_GENERATOR_FIXED
          dotnet run --project tools/nq-v23-research/NQResearchV23.csproj --no-build --configuration Release -- --write-example "$RUNNER_TEMP/nq_v23_config.json"
          test -s "$RUNNER_TEMP/nq_v23_config.json"
          grep -q 'NQ DEC2026' "$RUNNER_TEMP/nq_v23_config.json"
          grep -q 'BaselineGenes' "$RUNNER_TEMP/nq_v23_config.json"
          grep -q 'RankingCount' "$RUNNER_TEMP/nq_v23_config.json"
          grep -q 'MinimumFullSessionsPerMonth' "$RUNNER_TEMP/nq_v23_config.json"
          echo NQ_V23_OFFLINE_EXE_AND_CONFIG_TEMPLATE_PASS
      - name: Contract - no future dataset or native order entrypoints in V23
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NQNativeResearchRunnerV22.Run' research/nq/ninjatrader/NQNativeCompleteGeneratorV23.cs
          grep -q 'NQNativeEconomicLedgerV21' research/nq/ninjatrader/NQNativeCompleteGeneratorV23.cs
          grep -q 'NQNativePortfolioAuditV22' research/nq/ninjatrader/NQNativeResearchRunnerV22.cs
          grep -q 'FinalHoldout2025_2026' research/nq/ninjatrader/NQNativeFrozenCampaignV16.cs
          grep -q 'ExternalValidation2023_2024' research/nq/ninjatrader/NQNativeFrozenCampaignV16.cs
          ! grep -Eq '\\b(EnterLong|EnterShort|ExitLong|ExitShort|SetStopLoss|SetProfitTarget)\\s*\\(' research/nq/ninjatrader/NQNativeConfigV23.cs research/nq/ninjatrader/NQNativeCompleteGeneratorV23.cs tools/nq-v23-research/NQNativeV23Console.cs
          echo NQ_V23_FIXED_SCOPE_NO_NATIVE_ORDERS_NO_OPENED_HOLDOUTS
  complete-reports-and-byte-identical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: One 2020-22 development run must emit audit package with SHA and exact replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nqv23test"
          cat > "$RUNNER_TEMP/nqv23test/test.csproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/tools/nq-v23-research/NQResearchV23.csproj" />
            </ItemGroup>
          </Project>
          XML
          cp research/nq/ninjatrader/tests/NQNativeCompleteGeneratorV23Test.cs "$RUNNER_TEMP/nqv23test/Program.cs"
          dotnet run --project "$RUNNER_TEMP/nqv23test/test.csproj" --configuration Release
  regression-prior-v22-funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: No unintended V22 GA and risk changes when adding optional observer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nqv23regress"
          cat > "$RUNNER_TEMP/nqv23regress/test.csproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/tools/nq-v23-research/NQResearchV23.csproj" />
            </ItemGroup>
          </Project>
          XML
          cp research/nq/ninjatrader/tests/NQNativeFullFunnelV22Test.cs "$RUNNER_TEMP/nqv23regress/Program.cs"
          dotnet run --project "$RUNNER_TEMP/nqv23regress/test.csproj" --configuration Release
