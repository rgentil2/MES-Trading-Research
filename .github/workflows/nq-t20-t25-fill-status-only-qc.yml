name: NQ T20-T25 standalone Last fill-state QC only - no economics - DEV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t20-t25-fill-status-only-qc.yml'
      - 'local_nq_tick_2025_2026/nq_t20_t25_fill_status_qc.py'
      - 'local_nq_tick_2025_2026/test_nq_t20_t25_fill_status_qc.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: local_nq_tick_2025_2026:research/nq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify whitelist, sealed date and no missing member
        run: |
          set -euo pipefail
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_t20_t25_fill_status_qc.py' -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t20_t25_fill_status_qc.py
  qc:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: local_nq_tick_2025_2026:research/nq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse only seven encrypted PRIVATE DEV Last releases, checksum each
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/derived
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          for MONTH in 2025-10 2025-11 2025-12 2026-01 2026-02 2026-03 2026-04; do
            mkdir -p _private/arc _private/data
            gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
            (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
            7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
            python local_nq_tick_2025_2026/nq_t20_t25_fill_status_qc.py --root _private/data --month "$MONTH" --out "_private/derived/t20_t25_qc_${MONTH}.json"
            rm -rf _private/arc _private/data
          done
      - name: Reconcile all six previous case-control samples, publish only STATUS totals
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t20_t25_fill_status_qc.py --inputs _private/derived --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy original licensed Last and safe intermediate data on all paths
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t20-t25-all-six-standalone-fill-state-aggregates-only
          path: final/
          if-no-files-found: error
