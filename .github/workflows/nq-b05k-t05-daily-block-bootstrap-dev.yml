name: NQ B05K frozen T05 135 DEV sessions - block bootstrap SAFE aggregated only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-b05k-t05-daily-block-bootstrap-dev.yml'
      - 'research/nq/nq_b05k_t05_daily_block_bootstrap.py'
      - 'research/nq/test_nq_b05k_t05_daily_block_bootstrap.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: research/nq:local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact 135-day zero-inclusive block-bootstrap procedure without any private data
        run: |
          python -m unittest discover -s research/nq -p 'test_nq_b05k_t05_daily_block_bootstrap.py' -v
          python -m compileall -q research/nq/nq_b05k_t05_daily_block_bootstrap.py
  frozen-t05-daily:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/nq:local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive unpacker if needed
        run: |
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
      - name: Reconstruct frozen T05 DAILY outcome with SAME seven archived DEV Last releases - private in-runner only
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/derived
          for MONTH in 2025-10 2025-11 2025-12 2026-01 2026-02 2026-03 2026-04; do
            mkdir -p _private/arc _private/data
            gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
            (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
            7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
            python research/nq/nq_b05k_t05_daily_block_bootstrap.py --mode month --root _private/data --month "$MONTH" --private-out "_private/derived/t05_daily_${MONTH}.json"
            rm -rf _private/data _private/arc
          done
      - name: Produce ONLY statistical aggregate (daily vectors never uploaded)
        run: |
          python research/nq/nq_b05k_t05_daily_block_bootstrap.py --mode aggregate --private-inputs _private/derived --out b05k_safe/summary.json --report b05k_safe/report.md
          cat b05k_safe/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Erase ALL private licensed source and daily returns (even on failure)
        if: always()
        run: |
          rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: b05k-t05-135-session-block-bootstrap-aggregates-only
          path: b05k_safe/
          if-no-files-found: error
