name: NQ T05 T147 G0 Shared Router Preflight ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t05-t147-g0-parent-parity-preflight.yml'
      - 'local_nq_tick_2025_2026/nq_t05_t147_g0_preflight.py'
      - 'local_nq_tick_2025_2026/test_nq_t05_t147_g0_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nq-t05-t147-g0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  g0-only-parent-parity-and-exposure-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prereg and synthetic tests BEFORE any market data
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T05_T147_SHARED_ROUTER_G0_PREFLIGHT_PREREG_2026_10_13.md
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t05_t147_g0_preflight.py -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t05_t147_g0_preflight.py
      - name: Reuse checksum-verifiable historical seven DEV months ONLY
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          mkdir -p _private/arc _private/data _private/out
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          for MONTH in 2025-10 2025-11 2025-12 2026-01 2026-02 2026-03 2026-04; do
            python -c 'from nq_t05_t147_g0_preflight import guard_month; import sys;guard_month(sys.argv[1])' "$MONTH"
            gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
            (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
            7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
            python local_nq_tick_2025_2026/nq_t05_t147_g0_preflight.py --month "$MONTH" --root _private/data --out "_private/out/g0_t05_t147_${MONTH}.json"
            rm -rf _private/arc _private/data
            mkdir -p _private/arc _private/data
          done
      - name: Fail closed on mismatch; only safe aggregated G0 artifacts
        run: |
          set -euo pipefail
          mkdir -p final
          python local_nq_tick_2025_2026/nq_t05_t147_g0_preflight.py --inputs _private/out --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Securely remove licensed data and month outputs ALWAYS
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t05-t147-g0-preregistered-safe-parent-parity
          path: final/
          if-no-files-found: error
