name: B01 Pre-registered Hypothesis Block

on:
  push:
    branches: [main]
    paths:
      - "research/B01_PRE_REGISTRATION.md"
      - "research/active/R012_LOW_VOL_PERSISTENCE/**"
      - "research/active/R013_BULL_MOMENTUM/**"
      - "research/active/R014_STREAK_EXHAUSTION/**"
      - "research/active/R015_PREV_CLOSE_STRENGTH/**"
      - "research/b01_aggregate.py"
      - "tests/test_b01.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/b01-hypothesis-block.yml"
  workflow_dispatch:

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_b01.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run all four frozen hypotheses
        env:
          PYTHONPATH: .
        run: |
          python research/active/R012_LOW_VOL_PERSISTENCE/r012_low_vol_persistence.py
          python research/active/R013_BULL_MOMENTUM/r013_bull_momentum.py
          python research/active/R014_STREAK_EXHAUSTION/r014_streak_exhaustion.py
          python research/active/R015_PREV_CLOSE_STRENGTH/r015_prev_close_strength.py
          python research/b01_aggregate.py
      - name: Verify holdout policy
        run: |
          python - <<'PY'
          import pandas as pd
          for r in ["R012","R013"]:
              e=pd.read_parquet(f"results/B01/{r}/events.parquet")
              ts=pd.to_datetime(e["timestamp_et"],utc=True).dt.tz_convert("America/New_York")
              assert ts.dt.year.min()==2025 and ts.dt.year.max()==2025
          for r in ["R014","R015"]:
              e=pd.read_parquet(f"results/B01/{r}/events.parquet")
              ts=pd.to_datetime(e["timestamp_et"],utc=True).dt.tz_convert("America/New_York")
              assert ts.dt.year.max()<=2024
          print("B01 holdout policy verified; 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b01-r012-r015-results
          path: |
            results/B01/B01_SUMMARY.csv
            results/B01/B01_SUMMARY.md
            results/B01/R012/**
            results/B01/R013/**
            results/B01/R014/**
            results/B01/R015/**
          retention-days: 30
