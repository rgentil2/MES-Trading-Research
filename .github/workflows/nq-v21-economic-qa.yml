name: NQ V21 full M1 economic GA memo, restartable complete ledger and shortlist QA
on:
  push:
    paths:
      - 'research/nq/ninjatrader/NQNativeSignalCacheV14.cs'
      - 'research/nq/ninjatrader/NQNativeConditionCatalogV19.cs'
      - 'research/nq/ninjatrader/NQNativeFeatureMemoV21.cs'
      - 'research/nq/ninjatrader/NQNativeEconomicLedgerV21.cs'
      - 'research/nq/ninjatrader/NQNativeBulkEconomicV21.cs'
      - 'research/nq/ninjatrader/tests/NQNativeFeatureMemoV21Test.cs'
      - 'research/nq/ninjatrader/tests/NQNativeBulkEconomicV21Test.cs'
      - 'research/nq/ninjatrader/NQNativeResearchRunnerV21.cs'
      - 'research/nq/ninjatrader/tests/NQNativeFullFunnelV21Test.cs'
      - '.github/workflows/nq-v21-economic-qa.yml'
  pull_request:
    paths:
      - 'research/nq/ninjatrader/NQNativeSignalCacheV14.cs'
      - 'research/nq/ninjatrader/NQNativeConditionCatalogV19.cs'
      - 'research/nq/ninjatrader/NQNativeFeatureMemoV21.cs'
      - 'research/nq/ninjatrader/NQNativeEconomicLedgerV21.cs'
      - 'research/nq/ninjatrader/NQNativeBulkEconomicV21.cs'
      - 'research/nq/ninjatrader/tests/NQNativeFeatureMemoV21Test.cs'
      - 'research/nq/ninjatrader/tests/NQNativeBulkEconomicV21Test.cs'
      - 'research/nq/ninjatrader/NQNativeResearchRunnerV21.cs'
      - 'research/nq/ninjatrader/tests/NQNativeFullFunnelV21Test.cs'
      - '.github/workflows/nq-v21-economic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature-formula-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Verify V21 NQNativeFeatureMemoV21Test full source and economic-simulation semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feature-formula-sharing"
          cat > "$RUNNER_TEMP/feature-formula-sharing/test.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          for file in NQNativeConditionsV11 NQNativeConditionCatalogV18 NQFeatureMathV19 NQTrendFeaturesV19 NQMomentumFeaturesV19 NQVolatilityFeaturesV19 NQVolumeActionFeaturesV19 NQNativeConditionCatalogV19 NQNativeBooleanCanonicalV11 NQNativeExitCanonicalV11 NQNativeExitCanonicalV18 NQNativeExitCanonicalV19 NQNativeUniqueSearchV11 NQNativeEvolutionCoreV12 NQNativeATRExitMathV5 NQNativeG0RulesV6 NQNativeG0DiagnosticsV7 NQNativeDiscoveryScoreV9 NQNativeHistoricalEvaluatorV12 NQNativeSignalCacheV14 NQNativeScoreJournalV17 NQNativeExpandedResearchV19 NQNativeFeatureMemoV21 NQNativeEconomicLedgerV21 NQNativeBulkEconomicV21; do
            cp "research/nq/ninjatrader/${file}.cs" "$RUNNER_TEMP/feature-formula-sharing/"
          done
          cp "research/nq/ninjatrader/tests/NQNativeFeatureMemoV21Test.cs" "$RUNNER_TEMP/feature-formula-sharing/Program.cs"
          dotnet run --project "$RUNNER_TEMP/feature-formula-sharing/test.csproj" --configuration Release
      - name: Assert V21 uses same V12 conservative fills, not native NT8 APIs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EvaluateExpandedWithSignalProvider' research/nq/ninjatrader/NQNativeFeatureMemoV21.cs
          grep -q 'V21_FATAL_ECONOMIC_LEDGER_OR_SIMULATION' research/nq/ninjatrader/NQNativeBulkEconomicV21.cs
          grep -q 'NQNativeExitCanonicalV19.Analyze' research/nq/ninjatrader/NQNativeBulkEconomicV21.cs
          ! grep -Eq '\\b(EnterLong|EnterShort|ExitLong|ExitShort|RunIteration|SetProfitTarget|SetStopLoss)\\s*\\(' research/nq/ninjatrader/NQNativeBulkEconomicV21.cs
          echo NQ_V21_NO_NT8_ORDERS_ONLY_OFFLINE_M1_ECONOMIC_RESEARCH
  full-economic-replay-and-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Verify V21 NQNativeBulkEconomicV21Test full source and economic-simulation semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-economic-replay-and-ranking"
          cat > "$RUNNER_TEMP/full-economic-replay-and-ranking/test.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          for file in NQNativeConditionsV11 NQNativeConditionCatalogV18 NQFeatureMathV19 NQTrendFeaturesV19 NQMomentumFeaturesV19 NQVolatilityFeaturesV19 NQVolumeActionFeaturesV19 NQNativeConditionCatalogV19 NQNativeBooleanCanonicalV11 NQNativeExitCanonicalV11 NQNativeExitCanonicalV18 NQNativeExitCanonicalV19 NQNativeUniqueSearchV11 NQNativeEvolutionCoreV12 NQNativeATRExitMathV5 NQNativeG0RulesV6 NQNativeG0DiagnosticsV7 NQNativeDiscoveryScoreV9 NQNativeHistoricalEvaluatorV12 NQNativeSignalCacheV14 NQNativeScoreJournalV17 NQNativeExpandedResearchV19 NQNativeFeatureMemoV21 NQNativeEconomicLedgerV21 NQNativeBulkEconomicV21; do
            cp "research/nq/ninjatrader/${file}.cs" "$RUNNER_TEMP/full-economic-replay-and-ranking/"
          done
          cp "research/nq/ninjatrader/tests/NQNativeBulkEconomicV21Test.cs" "$RUNNER_TEMP/full-economic-replay-and-ranking/Program.cs"
          dotnet run --project "$RUNNER_TEMP/full-economic-replay-and-ranking/test.csproj" --configuration Release
      - name: Assert V21 uses same V12 conservative fills, not native NT8 APIs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EvaluateExpandedWithSignalProvider' research/nq/ninjatrader/NQNativeFeatureMemoV21.cs
          grep -q 'V21_FATAL_ECONOMIC_LEDGER_OR_SIMULATION' research/nq/ninjatrader/NQNativeBulkEconomicV21.cs
          grep -q 'NQNativeExitCanonicalV19.Analyze' research/nq/ninjatrader/NQNativeBulkEconomicV21.cs
          ! grep -Eq '\\b(EnterLong|EnterShort|ExitLong|ExitShort|RunIteration|SetProfitTarget|SetStopLoss)\\s*\\(' research/nq/ninjatrader/NQNativeBulkEconomicV21.cs
          echo NQ_V21_NO_NT8_ORDERS_ONLY_OFFLINE_M1_ECONOMIC_RESEARCH
  full-v21-portfolio-funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Execute full V21 economic ledger to V13 G0 to V15 portfolio/WF and versioned OOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nqv21full"
          cat > "$RUNNER_TEMP/nqv21full/test.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          for file in NQNativeConditionsV11 NQNativeConditionCatalogV18 NQFeatureMathV19 NQTrendFeaturesV19 NQMomentumFeaturesV19 NQVolatilityFeaturesV19 NQVolumeActionFeaturesV19 NQNativeConditionCatalogV19 NQNativeBooleanCanonicalV11 NQNativeExitCanonicalV11 NQNativeExitCanonicalV18 NQNativeExitCanonicalV19 NQNativeUniqueSearchV11 NQNativeEvolutionCoreV12 NQNativeATRExitMathV5 NQNativeG0RulesV6 NQNativeG0DiagnosticsV7 NQNativeDiscoveryScoreV9 NQNativeHistoricalEvaluatorV12 NQNativeSignalCacheV14 NQNativeWalkForwardV15 NQNativeWalkForwardV20 NQNativeRobustnessV13 NQNativePortfolioV13 NQNativeChronologicalRiskV15 NQNativeIntegratedPortfolioRiskV15 NQNativeDataLoaderV16 NQNativeFrozenCampaignV16 NQNativeScoreJournalV17 NQNativeExpandedResearchV19 NQNativeHeldoutSignalsV20 NQNativeV20OosEvaluator NQNativeResearchRunnerV16 NQNativeResearchRunnerV20 NQNativeFeatureMemoV21 NQNativeEconomicLedgerV21 NQNativeBulkEconomicV21 NQNativeResearchRunnerV21; do
            cp "research/nq/ninjatrader/${file}.cs" "$RUNNER_TEMP/nqv21full/"
          done
          cp research/nq/ninjatrader/tests/NQNativeFullFunnelV21Test.cs "$RUNNER_TEMP/nqv21full/Program.cs"
          dotnet run --project "$RUNNER_TEMP/nqv21full/test.csproj" --configuration Release
      - name: Verify full economic candidate ranking feeds the existing G0 and OOS without adding NinjaTrader order calls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NQNativeBulkEconomicV21.Run' research/nq/ninjatrader/NQNativeResearchRunnerV21.cs
          grep -q 'NQNativeIntegratedPortfolioRiskV15.Evaluate' research/nq/ninjatrader/NQNativeResearchRunnerV21.cs
          grep -q 'NQNativeWalkForwardV20' research/nq/ninjatrader/NQNativeResearchRunnerV21.cs
          ! grep -Eq '\\b(EnterLong|EnterShort|ExitLong|ExitShort|RunIteration|SetProfitTarget|SetStopLoss)\\s*\\(' research/nq/ninjatrader/NQNativeResearchRunnerV21.cs
          echo NQ_V21_ECONOMICS_TO_OOS_NO_LIVE_NT8_ORDERS
