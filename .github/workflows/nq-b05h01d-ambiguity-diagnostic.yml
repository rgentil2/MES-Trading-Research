name: NQ B05H01D first-blocker Last fill audit existing DEV (NO PnL)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-b05h01d-ambiguity-diagnostic.yml'
      - 'local_nq_tick_2025_2026/nq_b05h01d_fill_ambiguity_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile diagnostics and enforce synthetic prior H01 signal tests
        run: |
          python -m compileall -q local_nq_tick_2025_2026/nq_b05h01d_fill_ambiguity_month.py local_nq_tick_2025_2026/nq_b05h01d_fill_ambiguity_aggregate.py
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_b05h01_trade_expansion.py' -q
  months:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    env:
      MONTH: ${{ matrix.month }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse SAME archived existing DEV NQ Last only with verified SHA256
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
          (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
      - name: Diagnose first hard blocker only, NEVER replace missing PnL
        run: |
          python local_nq_tick_2025_2026/nq_b05h01d_fill_ambiguity_month.py --root _private/data --month "$MONTH" --out "b05h01d_safe/nq_b05h01d_${MONTH}.json"
      - name: Erase private licensed tick source before artifact
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: b05h01d-existing-${{ matrix.month }}
          path: b05h01d_safe/nq_b05h01d_*.json
          if-no-files-found: error
  aggregate:
    needs: months
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: b05h01d-existing-*
          merge-multiple: true
          path: _monthly
      - name: Reconcile 140/135 and report all counts (zero PnL)
        run: |
          python local_nq_tick_2025_2026/nq_b05h01d_fill_ambiguity_aggregate.py --inputs _monthly --out b05h01d_final/summary.json --report b05h01d_final/report.md
          cat b05h01d_final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: b05h01d-seven-month-safe-blocker-report
          path: b05h01d_final/
          if-no-files-found: error
