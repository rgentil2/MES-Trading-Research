name: NQ T133-T168 SHADOW D2 One-Account Portfolio - Existing DEV ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t133-t168-shadow-d2-one-account-portfolio-dev.yml'
      - 'research/nq/NQ_T133_T168_SHADOW_D2_PORTFOLIO_PREREG_2026_10_12.json'
      - 'local_nq_tick_2025_2026/nq_t133_t168_shadow_d2_portfolios.py'
      - 'local_nq_tick_2025_2026/test_nq_t133_t168_shadow_d2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shadow-only-one-protected-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze six portfolio allocations with no retrospective outcome selection within each day
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T133_T168_SHADOW_D2_PORTFOLIO_PREREG_2026_10_12.md
          test -s research/nq/NQ_T133_T168_SHADOW_D2_PORTFOLIO_PREREG_2026_10_12.json
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t133_t168_shadow_d2.py -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t133_t168_shadow_d2_portfolios.py
      - name: Fetch ORIGINAL FULL36 D1 SAFE aggregates for exact N and PnL parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _private/agg
          gh run download 38326216082 --repo rgentil2/MES-Trading-Research --name nq-t133-t168-economic-D1-modelled-unverified-36-safe-aggregates --dir _private/agg
          test -s _private/agg/summary.json
      - name: Reuse ONLY seven private already-stored DEV Last archives, verify each SHA256
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          for MONTH in 2025-10 2025-11 2025-12 2026-01 2026-02 2026-03 2026-04; do
            gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
            (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
            7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
            rm -rf _private/arc/*
          done
      - name: Shadow D2 post-hoc, one trade per account/day, 36-fold D1 exact parity hard gate
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t133_t168_shadow_d2_portfolios.py --root _private/data --original-summary _private/agg/summary.json --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Always erase ALL licensed Last and original D1 source aggregates
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t133-t168-shadow-d2-six-single-account-portfolios-safe
          path: final/
          if-no-files-found: error
