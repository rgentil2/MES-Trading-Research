name: NQ S0.66 G0 V7 all failures plus historical M1 MAE-MFE stress QA

on:
  push:
    branches: [research/nq-s066-g0-v7-all-reasons-mae-mfe-stress-20261102]
    paths:
      - "research/nq/ninjatrader/NQNativeG0DiagnosticsV7.cs"
      - "research/nq/ninjatrader/NQNativeG0RiskFitnessV7.cs"
      - "research/nq/ninjatrader/tests/NQNativeG0DiagnosticsV7ConsoleTest.cs"
      - "research/nq/ninjatrader/tests/NQNativeG0RiskFitnessV7ShimTest.cs"
      - ".github/workflows/nq-g0-v7-s066-diagnostics-mae-stress-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-pure-csharp-and-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and execute production V6 plus V7 pure diagnostic rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g0v7pure"
          cat > "$RUNNER_TEMP/g0v7pure/qa.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          cp research/nq/ninjatrader/NQNativeG0RulesV6.cs "$RUNNER_TEMP/g0v7pure/"
          cp research/nq/ninjatrader/NQNativeG0DiagnosticsV7.cs "$RUNNER_TEMP/g0v7pure/"
          cp research/nq/ninjatrader/tests/NQNativeG0DiagnosticsV7ConsoleTest.cs "$RUNNER_TEMP/g0v7pure/Program.cs"
          dotnet run --configuration Release --project "$RUNNER_TEMP/g0v7pure/qa.csproj"
      - name: Compile production V7 native fitness against strict simulated NT8 API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g0v7shim"
          cp "$RUNNER_TEMP/g0v7pure/qa.csproj" "$RUNNER_TEMP/g0v7shim/qa.csproj"
          cp research/nq/ninjatrader/NQNativeG0RulesV6.cs "$RUNNER_TEMP/g0v7shim/"
          cp research/nq/ninjatrader/NQNativeG0DiagnosticsV7.cs "$RUNNER_TEMP/g0v7shim/"
          cp research/nq/ninjatrader/NQNativeG0RiskFitnessV7.cs "$RUNNER_TEMP/g0v7shim/"
          cp research/nq/ninjatrader/tests/NQNativeG0RiskFitnessV7ShimTest.cs "$RUNNER_TEMP/g0v7shim/Program.cs"
          dotnet run --configuration Release --project "$RUNNER_TEMP/g0v7shim/qa.csproj"
      - name: Static safety contract
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const root='research/nq/ninjatrader/';
          const diagnostics=fs.readFileSync(root+'NQNativeG0DiagnosticsV7.cs','utf8');
          const fitness=fs.readFileSync(root+'NQNativeG0RiskFitnessV7.cs','utf8');
          for(const x of ['NQNativeG0RulesV6.Evaluate','MONTHLY_FREQUENCY',
                         'LOW_PROFIT_FACTOR','EXCESS_CLOSED_DRAWDOWN',
                         'EXCESS_M1_MAE_MFE_STRESS_DD','INVALID_MAE_MFE',
                         'possiblePeak','equity-t.MaeCurrency',
                         'equity+t.MfeCurrency','MaxStressProxyDDUSD=2000.0'])
            assert(diagnostics.includes(x),x);
          for(const x of ['t.MaeCurrency,t.MfeCurrency','t.ProfitCurrency',
                          'NQ_G0_V7','Value=NQNativeG0RulesV6.RejectScore',
                          'NQNativeGeneticLabV5','NQNativeG0DiagnosticsV7.Evaluate'])
            assert(fitness.includes(x),x);
          assert(!fitness.includes('RunIteration('));
          assert(!fitness.includes('EnterLong('));
          console.log('NQ_S066_G0_V7_STATIC_SAFETY_QA_PASS');
          JS
