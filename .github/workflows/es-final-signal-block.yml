name: ES Final Signal Block

on:
  push:
    branches: [main]
    paths:
      - "research/es_final_block.py"
      - ".github/workflows/es-final-signal-block.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/es_final_block.py"
      - ".github/workflows/es-final-signal-block.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-es-final-block:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without LFS smudge
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull ES development LFS only
        shell: bash
        run: |
          git lfs install
          git lfs pull --include="data_es_staging/raw_lfs/ES_*20/*,data_es_staging/raw_lfs/ES_*21/*,data_es_staging/raw_lfs/ES_*22/*,data_es_staging/raw_lfs/ES_*23/*,data_es_staging/raw_lfs/ES_*24/*" --exclude=""

      - name: Verify holdouts were not materialized
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for y in ("25","26"):
              for p in Path("data_es_staging/raw_lfs").glob(f"ES_*{y}/*_Minute_Last.txt"):
                  if p.exists() and p.stat().st_size > 1000:
                      bad.append(str(p))
          if bad:
              raise SystemExit("Holdout LFS objects materialized unexpectedly: " + ", ".join(bad))
          print("Holdout check passed: ES 2025/2026 remain LFS pointers only.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: pip install pandas numpy

      - name: Run preregistered ES block
        run: python research/es_final_block.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: es-final-signal-block-results
          path: results/es_final_block/
          retention-days: 30
