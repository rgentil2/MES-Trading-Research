name: NQ Tick QC Oct 2025-Jun 2026 (manual, public standard runner)
on:
  workflow_dispatch:
    inputs:
      day:
        description: "ET date in Oct 2025 to Jun 2026 (e.g. 2025-10-15)"
        type: string
        required: true
        default: "2025-10-15"
      use_private_market_data:
        description: "Download ONLY this development day from private Dev repo"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  nq-source-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test time scope and synthetic ticks (no credentials)
        env:
          PYTHONPATH: local_nq_tick_2025_2026
        run: python -m unittest discover -s local_nq_tick_2025_2026 -p test_qc_tick_day.py -v
      - name: Reject sealed/unauthorized date before any download
        if: ${{ inputs.use_private_market_data }}
        env:
          SELECTED_DAY: ${{ inputs.day }}
          PYTHONPATH: local_nq_tick_2025_2026
        run: |
          python - <<'PY'
          import os
          from qc_tick_day import check_day
          d = check_day(os.environ["SELECTED_DAY"])
          if d.weekday() >= 5:
              raise SystemExit("Select a weekday trading session")
          print("Authorized development date:", d.isoformat())
          PY
      - name: Download and checksum three encrypted-at-rest private development archives
        if: ${{ inputs.use_private_market_data }}
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
          SELECTED_DAY: ${{ inputs.day }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing NQ_DEV_TICKS_READ_TOKEN (Dev repo read-only; no Sealed access)"
            exit 2
          fi
          MONTH="$(printf '%s' "$SELECTED_DAY" | cut -c 1-7)"
          TAG="nq-tick-$MONTH"
          mkdir -p _nq_private_tmp/archives _nq_private_tmp/extracted
          for KIND in Last Bid Ask; do
            gh release download "$TAG" --repo rgentil2/NQ-Ticks-Dev-2026 \
              --pattern "NQ_$MONTH"_"$KIND.7z.001" \
              --pattern "NQ_$MONTH"_"$KIND.7z.sha256" \
              --dir _nq_private_tmp/archives
          done
          (
            cd _nq_private_tmp/archives
            for HASH in *.sha256; do sha256sum -c "$HASH"; done
          )
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y p7zip-full
          fi
          DAY_COMPACT="$(printf '%s' "$SELECTED_DAY" | tr -d '-')"
          for ARCHIVE in _nq_private_tmp/archives/*.7z.001; do
            7z x "$ARCHIVE" -y -r "*$DAY_COMPACT*" -o_nq_private_tmp/extracted >/dev/null
          done
      - name: Preliminary QC of exactly one development day (aggregate-only)
        if: ${{ inputs.use_private_market_data }}
        env:
          SELECTED_DAY: ${{ inputs.day }}
        run: |
          python local_nq_tick_2025_2026/qc_tick_day.py \
            --day "$SELECTED_DAY" \
            --root _nq_private_tmp/extracted
      - name: Delete private archive and tick contents
        if: ${{ always() }}
        run: rm -rf _nq_private_tmp
