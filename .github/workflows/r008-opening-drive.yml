name: R008 Opening Drive research

on:
  push:
    branches: [main]
    paths:
      - "research/active/R008_OPENING_DRIVE/**"
      - "src/research_utils.py"
      - "tests/test_r008_opening_drive.py"
      - "src/data_pipeline.py"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/r008-opening-drive.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_r008_opening_drive.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run R008 development
        env:
          PYTHONPATH: .
        run: |
          python research/active/R008_OPENING_DRIVE/r008_opening_drive.py \
            --start 2020-01-01 \
            --end 2024-12-31 \
            --output-dir results/R008/development_2020_2024
      - name: Verify holdout
        run: |
          python - <<'PY'
          import pandas as pd
          e = pd.read_parquet("results/R008/development_2020_2024/events.parquet")
          ts = pd.to_datetime(e["timestamp_et"], utc=True).dt.tz_convert("America/New_York")
          assert ts.dt.year.max() <= 2024
          assert ((ts.dt.hour * 60 + ts.dt.minute) == 600).all()
          print("R008 isolation verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r008-opening-drive-development-2020-2024
          path: |
            results/R008/development_2020_2024/SUMMARY.md
            results/R008/development_2020_2024/primary_hypothesis.csv
            results/R008/development_2020_2024/yearly_stability.csv
            results/R008/development_2020_2024/side_breakdown.csv
            results/R008/development_2020_2024/events.parquet
          retention-days: 30
