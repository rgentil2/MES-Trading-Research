name: NQ S0.34 12 frozen AST full M1 trade replay exploratory synthetic QA

on:
  workflow_dispatch:
  push:
    branches: [research/nq-s034-12ast-3day-real-m1-exploratory-replay-20261029]
    paths:
      - "research/nq/nq_m1_v39_ast_ist_exploratory_order_replay.py"
      - "research/nq/test_nq_m1_v39_ast_ist_exploratory_order_replay.py"
      - ".github/workflows/nq-m1-v39-ast-3day-replay-qa.yml"

permissions:
  contents: read

jobs:
  synthetic-reference-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas "TA-Lib==0.6.8"
      - name: Entire no-market regression including differential trade lifecycle QA
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m unittest discover -s research/nq -p 'test_nq_m1_v*.py' -q
      - name: Account and economic release hard stop
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from research.nq.nq_m1_v22_quality_gate import audit
          from research.nq.nq_m1_v39_ast_ist_exploratory_order_replay import STATUS
          a=audit()
          assert a["checks_total"]==13 and a["passed_verified"]==0
          assert a["decision"]=="EXECUTION_BLOCKED"
          assert "EXPLORATORY" in STATUS and "NOT_CERTIFIED" in STATUS
          print("NQ_S034_ONLY_BOUNDED_EXPLORATORY_IST_REPLAY_NOT_FORMAL_G0")
          PY
