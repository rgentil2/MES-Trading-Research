name: NQ T133–T168 36 Full Strategy Cohort D0 Existing DEV NO FUTURES
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t133-t168-combined-36-executable-D0-dev.yml'
      - 'research/nq/NQ_T153_T168_FOUR_STRATEGY_BLOCKS_D0_PREREG_2026_10_12.json'
      - 'local_nq_tick_2025_2026/nq_t153_t168_executable_d0_features.py'
      - 'local_nq_tick_2025_2026/nq_t133_t168_combined_D0_batch.py'
      - 'local_nq_tick_2025_2026/test_nq_t133_t168_combined_d0.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-and-synthetic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original 20 + 16 new frozen before reading DEV, no future outcomes
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T153_T168_FOUR_STRATEGY_BLOCKS_D0_PREREG_2026_10_12.md
          test -s research/nq/NQ_T133_T152_D0_COUNTS_FROZEN_2026_10_12.json
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t133_t168_combined_d0.py -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t153_t168_executable_d0_features.py local_nq_tick_2025_2026/nq_t133_t168_combined_D0_batch.py
  seven-existing-dev-months:
    needs: freeze-and-synthetic-gate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    env:
      MONTH: ${{ matrix.month }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse ONLY licensed Last already saved in DEV release and verify SHA256
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
          (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
      - name: Causal G0/D0 all original 36 strategy masks, no futures or fills
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t133_t168_combined_D0_batch.py --root _private/data --month "$MONTH" --out "safe/t133_t168_d0_${MONTH}.json"
      - name: Always destroy original raw licensed Last before uploading SAFE counts
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t133-t168-d0-safe-${{ matrix.month }}
          path: safe/t133_t168_d0_*.json
          if-no-files-found: error
  aggregate-whole-family:
    needs: seven-existing-dev-months
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nq-t133-t168-d0-safe-*
          merge-multiple: true
          path: _monthly
      - name: Compare old 20 EXACTLY to frozen, then evaluate all 36 across 8 blocks
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t133_t168_combined_D0_batch.py --inputs _monthly --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t133-t168-36-strategy-cohort-D0-only-safe
          path: final/
          if-no-files-found: error
