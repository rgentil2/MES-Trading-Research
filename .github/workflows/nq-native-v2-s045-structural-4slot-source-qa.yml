name: NQ S0.45 NT8 native V2 four-slot structural source QA

on:
  workflow_dispatch:
  push:
    branches: [research/nq-s045-nt8-native-4slot-structural-v2-20261102]
    paths:
      - "research/nq/ninjatrader/NQNativeGeneticLabV2.cs"
      - ".github/workflows/nq-native-v2-s045-structural-4slot-source-qa.yml"

permissions:
  contents: read

jobs:
  static-source-structural-guardrails-not-NT8-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate C# source contract and V1 isolation; NOT a NinjaTrader compilation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), assert = require('assert');
          const f = p=>fs.readFileSync('research/nq/ninjatrader/'+p+'.cs','utf8');
          const v1=f('NQNativeGeneticLabV1'), v2=f('NQNativeGeneticLabV2');
          const exact=s=>(v2.match(s)||[]).length;
          assert(v1.includes('class NQNativeGeneticLabV1 : Strategy'));
          assert(!v1.includes('ConditionCount'));
          assert(v2.includes('class NQNativeGeneticLabV2 : Strategy'));
          assert(!v2.includes('class NQNativeGeneticLabV1 : Strategy'));
          assert.equal(exact(/\[NinjaScriptProperty\]/g),16);
          assert.equal(exact(/case [0-9]:/g),10);
          for(const x of ['ConditionCount','AType','APeriod','BType','BPeriod',
             'CType','CPeriod','DType','DPeriod','CombineAB','CombineBC',
             'CombineCD','ReverseSignals','StopTicks','TargetTicks',
             'MaxDailyEntrySubmissions'])
             assert(v2.includes('public int '+x+' { get; set; }'),x);
          for(const x of ['ConditionCount >= 2','ConditionCount >= 3','ConditionCount >= 4',
            'if (barsThisSession < required)', 'if (bull == bear)',
            'State != State.Historical','IsInstantiatedOnEachOptimizationIteration = true',
            'OrderFillResolution = OrderFillResolution.Standard',
            'IsFillLimitOnTouch = false', 'IncludeCommission = true',
            'Slippage = 2','LastSignalHHmmss = 112700',
            'FlatSubmitHHmmss = 112800','SetStopLoss(CalculationMode.Ticks, StopTicks)',
            'SetProfitTarget(CalculationMode.Ticks, TargetTicks)',
            'Time[0].Year < 2020 || Time[0].Year > 2022'])
             assert(v2.includes(x),'Missing: '+x);
          assert(!v2.includes('CombineMode'),'Stale V1 gene');
          const opens=(v2.match(/\{/g)||[]).length,closes=(v2.match(/\}/g)||[]).length;
          assert.equal(opens,closes);
          assert(!/(File\.Read|StreamReader|Process\.Start|\.csv|python\.exe)/i.test(v2));
          // Verify the written V2 AND/OR expression scheme matches V1 with 2 slots.
          assert(v1.includes('aBull && bBull') && v2.includes('bull && bBull'));
          assert(v1.includes('aBear || bBear') && v2.includes('bear || bBear'));
          // A standalone logic sanity probe; this does NOT execute NinjaScript.
          const join=(x,y,m)=>m===0?(x&&y):(x||y);
          const fold=(xs,ms)=>xs.slice(1).reduce((a,b,i)=>join(a,b,ms[i]),xs[0]);
          for(const a of [false,true]) for(const b of [false,true])
            for(const m of [0,1]) assert.equal(fold([a,b],[m]),join(a,b,m));
          assert.equal(fold([true,false,true],[1,0]),true);
          assert.equal(fold([true,false,true],[0,1]),true);
          assert.equal(fold([true,false,true,true],[0,1,0]),true);
          console.log('NQ_S045_V2_4SLOT_16GENES_SOURCE_CONTRACT_PASS');
          console.log('NO_NINJATRADER_COMPILE_NO_HISTORICAL_BACKTEST_NO_ATR_YET');
          NODE
