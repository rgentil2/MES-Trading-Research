name: Build NinjaTrader POC support bundle

on:
  push:
    branches: [main]
    paths:
      - 'research/build_ninjatrader_poc_support.py'
      - 'ninjatrader/POCBreakdownParity.cs'
      - 'tools/build_forexfactory_calendar.py'
      - '.github/workflows/build-ninjatrader-poc-support.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow pyyaml scipy statsmodels requests beautifulsoup4
      - name: Build frozen Forex Factory calendar
        run: python tools/build_forexfactory_calendar.py --start-year 2020 --end-year 2025
      - name: Build POC support CSVs
        run: python research/build_ninjatrader_poc_support.py
      - name: Copy NinjaScript into bundle
        run: cp ninjatrader/POCBreakdownParity.cs results/ninjatrader_poc_support/
      - uses: actions/upload-artifact@v4
        with:
          name: ninjatrader-poc-parity-bundle
          path: results/ninjatrader_poc_support/*
          if-no-files-found: error
