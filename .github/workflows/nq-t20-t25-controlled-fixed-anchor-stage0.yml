name: NQ T20-T25 six new controlled hypotheses - fixed-anchor STAGE0 DEV only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t20-t25-controlled-fixed-anchor-stage0.yml'
      - 'local_nq_tick_2025_2026/nq_t20_t25_*.py'
      - 'local_nq_tick_2025_2026/test_nq_t20_t25_fixed_anchor.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test sealed gate, all six distinct labels and aggregate BEFORE reading any Last
        run: |
          set -euo pipefail
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_t20_t25_fixed_anchor.py' -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t20_t25_fixed_anchor_screen.py local_nq_tick_2025_2026/nq_t20_t25_stage0_aggregate.py
  months:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    env:
      MONTH: ${{ matrix.month }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse ONLY the seven EXISTING NQ Last DEV release archives and SHA256
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
          (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
      - name: Safe first-anchor case and control counts; NO future outcomes
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t20_t25_fixed_anchor_screen.py --root _private/data --month "$MONTH" --out "safe/t20_t25_${MONTH}.json"
      - name: Destroy licensed raw even if previous step fails
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t20-t25-safe-month-${{ matrix.month }}
          path: safe/t20_t25_*.json
          if-no-files-found: error
  aggregate:
    needs: months
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nq-t20-t25-safe-month-*
          merge-multiple: true
          path: _monthly
      - name: Fail closed unless exact 7 months and 140/135 reconciliation
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t20_t25_stage0_aggregate.py --inputs _monthly --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t20-t25-stage0-safe-case-control-only
          path: final/
          if-no-files-found: error
