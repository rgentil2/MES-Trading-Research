name: MES parameter stability P1B

on:
  push:
    branches: [main]
    paths:
      - 'research/mes_parameter_stability_p1b.py'
      - 'research/MES_PARAMETER_STABILITY_P1B_PROTOCOL.md'
      - '.github/workflows/mes-parameter-stability-p1b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parameter-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow pyyaml scipy statsmodels
      - name: Execute P1B diagnostics
        run: python research/mes_parameter_stability_p1b.py
      - uses: actions/upload-artifact@v4
        with:
          name: mes-parameter-stability-p1b
          path: results/parameter_stability_p1b/*
          if-no-files-found: error
