name: NQ V8 S0.68 M1 Frequency and Chronological Bar-Close Risk Shim QA

on:
  push:
    branches: [research/nq-s068-v8-chronological-risk-frequency-20261105]
    paths:
      - "research/nq/ninjatrader/NQNativeGeneticLabV8Audit.cs"
      - "research/nq/ninjatrader/tests/NQNativeGeneticLabV8AuditShimTest.cs"
      - ".github/workflows/nq-v8-s068-m1-risk-frequency-shim-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shim-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and run production V8 against simulated NT8 strategy base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v8-audit"
          cat > "$RUNNER_TEMP/v8-audit/qa.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          cp research/nq/ninjatrader/NQNativeGeneticLabV8Audit.cs "$RUNNER_TEMP/v8-audit/"
          cp research/nq/ninjatrader/tests/NQNativeGeneticLabV8AuditShimTest.cs "$RUNNER_TEMP/v8-audit/Program.cs"
          dotnet run --configuration Release --project "$RUNNER_TEMP/v8-audit/qa.csproj"
      - name: Guard original V5 untouched and observer does not submit orders
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const v8=fs.readFileSync('research/nq/ninjatrader/NQNativeGeneticLabV8Audit.cs','utf8');
          const v5=fs.readFileSync('research/nq/ninjatrader/NQNativeGeneticLabV5.cs','utf8');
          for(const x of ['public class NQNativeGeneticLabV8Audit : NQNativeGeneticLabV5',
                          'base.OnBarUpdate();','State!=State.Historical',
                          'Position.GetUnrealizedProfitLoss','actualCompletedTrades',
                          'NQ_V8_MONTH','NQ_V8_FREQ','NQ_V8_RISK'])
            assert(v8.includes(x),x);
          for(const banned of ['EnterLong(', 'EnterShort(', 'ExitLong(', 'ExitShort(',
                              'SetStopLoss(', 'SetProfitTarget(', 'SetState('])
            assert(!v8.includes(banned),'V8 nontrading: '+banned);
          assert(v5.includes('class NQNativeGeneticLabV5'));
          console.log('NQ_S068_V8_STATIC_CONTRACT_PASS');
          JS
