name: NQ B04 frozen T05 temporal robustness DEV
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nq-b04-temporal-dev.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  months:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    env:
      MONTH: ${{ matrix.month }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: B04 tests and existing frozen T04 regression
        run: |
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_b04_temporal_robustness.py' -v
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_t05_fibonacci_bars.py' -v
      - name: Download only selected private DEV NQ Tick Last
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
          (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
      - name: Evaluate frozen calendar/ISO weekly aggregates only
        run: python local_nq_tick_2025_2026/nq_b04_temporal_month.py --root _private/data --month "$MONTH" --out "b04_safe/nq_b04_${MONTH}.json"
      - name: Delete raw source before publishing
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: b04-month-${{ matrix.month }}
          path: b04_safe/*.json
          if-no-files-found: error
  aggregate:
    needs: months
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: b04-month-*
          merge-multiple: true
          path: _monthly
      - name: B04 seven month normalized week/report
        run: |
          python local_nq_tick_2025_2026/nq_b04_temporal_aggregate.py --inputs _monthly --out b04_final/summary.json --report b04_final/report.md
          cat b04_final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: b04-seven-month-temporal-summary
          path: b04_final/
