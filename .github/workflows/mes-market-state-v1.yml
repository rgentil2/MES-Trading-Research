name: MES Market State V1 descriptive audit

on:
  push:
    branches: [main]
    paths:
      - 'src/mes_market_state_v1.py'
      - 'tools/audit_mes_market_state.py'
      - 'tests/test_mes_market_state_v1.py'
      - 'research/market_state/**'
      - '.github/workflows/mes-market-state-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descriptive-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyyaml pytest
      - name: Verify fixed definitions before opening data
        run: python tools/audit_mes_market_state.py --preflight
      - name: Verify causal classification and input isolation
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mes_market_state_v1.py tests/test_data_pipeline.py
      - name: Describe 2020-2024 without strategy outcomes
        run: python tools/audit_mes_market_state.py
      - uses: actions/upload-artifact@v4
        with:
          name: mes-market-state-v1-2020-2024
          path: results/market_state/MES_MS1_*
          if-no-files-found: error
