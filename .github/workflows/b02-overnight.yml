name: B02 Overnight Structure

on:
  push:
    branches: [main]
    paths:
      - "research/B02_OVERNIGHT_PRE_REGISTRATION.md"
      - "research/active/B02_OVERNIGHT/**"
      - "tests/test_b02_overnight.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/b02-overnight.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_b02_overnight.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run frozen B02
        env:
          PYTHONPATH: .
        run: python research/active/B02_OVERNIGHT/b02_overnight.py
      - name: Verify 2026 isolation
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          for f in glob.glob("results/B02/*.parquet"):
              d=pd.read_parquet(f)
              if d.empty:
                  continue
              for col in ["first_rth_ts","timestamp_et","firstbar_timestamp"]:
                  if col in d.columns:
                      ts=pd.to_datetime(d[col],utc=True,errors="coerce").dropna().dt.tz_convert("America/New_York")
                      if len(ts):
                          assert ts.dt.year.max()<=2025,(f,col,ts.dt.year.max())
          print("B02 verified: 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b02-overnight-results
          path: results/B02/**
          retention-days: 30
