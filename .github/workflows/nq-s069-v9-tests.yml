name: NQ S0.69 native discovery V9 pure C# checks

on:
  push:
    paths:
      - 'research/nq/ninjatrader/NQNativeDiscoveryScoreV9.cs'
      - 'research/nq/tests/s069_v9/**'
      - '.github/workflows/nq-s069-v9-tests.yml'
  pull_request:
    paths:
      - 'research/nq/ninjatrader/NQNativeDiscoveryScoreV9.cs'
      - 'research/nq/tests/s069_v9/**'
      - '.github/workflows/nq-s069-v9-tests.yml'
  workflow_dispatch:

jobs:
  discovery-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute pure C# discovery objective invariants
        run: dotnet run --project research/nq/tests/s069_v9/ResearchV9.csproj --configuration Release
      - name: Ensure adapter is non-trading and declares native fitness
        shell: bash
        run: |
          grep -q 'class NQNativeDiscoveryFitnessV9 : OptimizationFitness' research/nq/ninjatrader/NQNativeDiscoveryFitnessV9.cs
          grep -q 'OnCalculatePerformanceValue(StrategyBase strategy)' research/nq/ninjatrader/NQNativeDiscoveryFitnessV9.cs
          ! grep -Eq '\b(EnterLong|EnterShort|ExitLong|ExitShort|SetStopLoss|SetProfitTarget|RunIteration)\s*\(' research/nq/ninjatrader/NQNativeDiscoveryFitnessV9.cs
