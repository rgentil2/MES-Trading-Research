name: NQ 38-member T59-T96 Whole-Cohort D1 - Preregistered - DEV Only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t59-t96-full-cohort-38-d1-dev.yml'
      - 'local_nq_tick_2025_2026/nq_t59_t96_d1_cohort.py'
      - 'local_nq_tick_2025_2026/test_nq_t59_t96_d1_cohort.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-and-prereg-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preregistered 38 outcomes, frozen 31 diverse D0 before any D1 data
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T59_T96_COHORT_38_D1_PREREG_2026_10_12.md
          test -s research/nq/NQ_T59_T96_COHORT_D0_COUNTS_FROZEN_2026_10_12.json
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_t59_t96_d1_cohort.py' -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t59_t96_d1_cohort.py
  seven-months-D1:
    needs: synthetic-and-prereg-gate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    env:
      MONTH: ${{ matrix.month }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing licensed Last DEV only, SHA256 verification
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
          (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
      - name: Full frozen 38-member D1 outcomes to PRIVATE ephemeral session vectors
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t59_t96_d1_cohort.py --root _private/data --month "$MONTH" --out "_private/out/t59_t96_d1_${MONTH}.json"
      - name: Package encrypted-job-only transfer (private within same workflow)
        run: |
          set -euo pipefail
          # Intermediate vectors do NOT become a public artifact. Reaggregate
          # within the isolated protected execution job instead.
          test -s "_private/out/t59_t96_d1_${MONTH}.json"
      - name: Erase licensed source and daily markouts always
        if: always()
        run: rm -rf _private
