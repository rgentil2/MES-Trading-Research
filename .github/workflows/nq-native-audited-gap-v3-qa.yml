name: NQ native analyzer V3 audited removed-session gap guard
on:
  push:
    paths:
      - 'research/nq/ninjatrader/NQNativeSignalCacheV14.cs'
      - 'research/nq/ninjatrader/tests/NQNativeAuditedGapV3Test.cs'
      - '.github/workflows/nq-native-audited-gap-v3-qa.yml'
  pull_request:
    paths:
      - 'research/nq/ninjatrader/NQNativeSignalCacheV14.cs'
      - 'research/nq/ninjatrader/tests/NQNativeAuditedGapV3Test.cs'
      - '.github/workflows/nq-native-audited-gap-v3-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-excluded-session-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Compile consolidated V23+V24+V25 modules
        run: dotnet build tools/nq-v25-native/NQNativeV25OneShot.csproj --configuration Release --nologo
      - name: Verify V14 fail-closed gap guard with real March 2020 dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gapguard"
          cat > "$RUNNER_TEMP/gapguard/test.csproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/tools/nq-v23-research/NQResearchV23.csproj" />
            </ItemGroup>
          </Project>
          XML
          cp research/nq/ninjatrader/tests/NQNativeAuditedGapV3Test.cs "$RUNNER_TEMP/gapguard/Program.cs"
          dotnet run --project "$RUNNER_TEMP/gapguard/test.csproj" --configuration Release
