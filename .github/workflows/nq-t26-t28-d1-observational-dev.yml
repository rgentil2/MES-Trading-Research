name: NQ T26-T28 Frozen D1 Observational Only - Existing Seven DEV Months
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t26-t28-d1-observational-dev.yml'
      - 'local_nq_tick_2025_2026/nq_t26_t28_d1_observational.py'
      - 'local_nq_tick_2025_2026/test_nq_t26_t28_d1_observational.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen PREREG before any new outcome and synthetic gates
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T26_T28_D1_OBSERVATIONAL_PREREG_2026_10_12.md
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_nq_t26_t28_d1_observational.py' -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t26_t28_d1_observational.py
  dev-only:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse ONLY existing NQ Last DEV archives, sha256 each; all outcomes private
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/derived
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          for MONTH in 2025-10 2025-11 2025-12 2026-01 2026-02 2026-03 2026-04; do
            mkdir -p _private/arc _private/data
            gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
            (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
            7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
            python local_nq_tick_2025_2026/nq_t26_t28_d1_observational.py --root _private/data --month "$MONTH" --out "_private/derived/d1_${MONTH}.json"
            rm -rf _private/arc _private/data
          done
      - name: Frozen full-family 3 member block bootstrap 10k sessions and BH 3
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t26_t28_d1_observational.py --inputs _private/derived --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Erase ALL licensed Last, day vectors and private markouts
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t26-t28-frozen-d1-safe-full-family
          path: final/
          if-no-files-found: error
