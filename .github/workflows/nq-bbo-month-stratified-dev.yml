name: NQ 36-session month-stratified BBO QC (public standard runner)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-bbo-month-stratified-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nq-bbo-month-stratified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  q4-2025-h1-2026:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic causality and locked-month QC safety tests
        env:
          PYTHONPATH: local_nq_tick_2025_2026
        run: |
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_qc_bbo_dislocation.py -v
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_qc_bbo_month_batch.py -v
      - name: Preflight exactly four source-manifest dates (DEV only)
        env:
          PYTHONPATH: local_nq_tick_2025_2026
        run: |
          python - <<'PY'
          import os
          from qc_tick_day import check_day
          from qc_bbo_month_batch import DAYS_BY_MONTH
          month=os.environ['MONTH']
          if month not in DAYS_BY_MONTH: raise SystemExit('Forbidden month')
          if len(DAYS_BY_MONTH[month])!=4:raise SystemExit('Wrong day count')
          for dd in DAYS_BY_MONTH[month]:
              day=check_day(month+'-'+dd)
              if day.weekday()>=5:raise SystemExit('Weekend day forbidden')
          print('Predeclared DEV dates validated:', month, ','.join(DAYS_BY_MONTH[month]))
          PY
      - name: Download one PRIVATE DEV month Last-Bid-Ask (never Sealed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'Missing Dev-only Contents Read token'; exit 2
          fi
          TAG="nq-tick-$MONTH"
          mkdir -p _nq_private_tmp/archives _nq_private_tmp/extracted
          for KIND in Last Bid Ask; do
            gh release download "$TAG" --repo rgentil2/NQ-Ticks-Dev-2026 \
              --pattern "NQ_${MONTH}_${KIND}.7z.001" \
              --pattern "NQ_${MONTH}_${KIND}.7z.sha256" \
              --dir _nq_private_tmp/archives
          done
          (
            cd _nq_private_tmp/archives
            for HASH in *.sha256; do sha256sum -c "$HASH"; done
          )
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y p7zip-full
          fi
          # Use one extraction per archive; four dates per month, not four downloads.
          DAYS=$(PYTHONPATH=local_nq_tick_2025_2026 python -c "import os; from qc_bbo_month_batch import DAYS_BY_MONTH; print(' '.join(DAYS_BY_MONTH[os.environ['MONTH']]))")
          read -ra PARTS <<< "$DAYS"
          PATTERNS=()
          YYYYMM="${MONTH//-/}"
          for DD in "${PARTS[@]}"; do
            PATTERNS+=("*${YYYYMM}${DD}*")
          done
          for ARCHIVE in _nq_private_tmp/archives/*.7z.001; do
            7z x "$ARCHIVE" -y -r "${PATTERNS[@]}" -o_nq_private_tmp/extracted >/dev/null
          done
      - name: Analyze four days and report medians (aggregate only)
        run: |
          python local_nq_tick_2025_2026/qc_bbo_month_batch.py \
            --month "$MONTH" --root _nq_private_tmp/extracted
      - name: Remove all temporary market files
        if: ${{ always() }}
        run: rm -rf _nq_private_tmp
