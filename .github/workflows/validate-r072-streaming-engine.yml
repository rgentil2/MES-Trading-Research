name: Validate R072 streaming engine emulation

on:
  push:
    branches: [main]
    paths:
      - 'research/r072_streaming_engine_emulation.py'
      - '.github/workflows/validate-r072-streaming-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow pyyaml scipy statsmodels
      - run: python research/r072_streaming_engine_emulation.py
      - uses: actions/upload-artifact@v4
        with:
          name: r072-streaming-engine-validation
          path: results/r072_streaming_engine_emulation/*
          if-no-files-found: error
