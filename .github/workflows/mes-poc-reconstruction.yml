name: MES POC breakdown reconstruction

on:
  push:
    branches: [main]
    paths:
      - 'research/mes_poc_breakdown_reconstruction.py'
      - '.github/workflows/mes-poc-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow pyyaml scipy statsmodels
      - name: Execute POC reconstruction
        run: python research/mes_poc_breakdown_reconstruction.py
      - uses: actions/upload-artifact@v4
        with:
          name: mes-poc-reconstruction
          path: results/poc_breakdown_reconstruction/*
          if-no-files-found: error
