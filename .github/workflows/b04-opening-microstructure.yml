name: B04 Opening Microstructure

on:
  push:
    branches: [main]
    paths:
      - "research/B04_OPENING_MICROSTRUCTURE_PRE_REGISTRATION.md"
      - "research/active/B04_OPENING_MICROSTRUCTURE/**"
      - "tests/test_b04_opening_microstructure.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/b04-opening-microstructure.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_b04_opening_microstructure.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run frozen B04
        env:
          PYTHONPATH: .
        run: python research/active/B04_OPENING_MICROSTRUCTURE/b04_opening_microstructure.py
      - name: Verify 2026 isolation
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          for f in glob.glob("results/B04/*.parquet"):
              d=pd.read_parquet(f)
              if d.empty:
                  continue
              if "first_ts" in d.columns:
                  ts=pd.to_datetime(d["first_ts"],utc=True,errors="coerce").dropna().dt.tz_convert("America/New_York")
                  if len(ts):
                      assert ts.dt.year.max()<=2025,(f,ts.dt.year.max())
          print("B04 verified: 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b04-opening-microstructure-results
          path: results/B04/**
          retention-days: 30
