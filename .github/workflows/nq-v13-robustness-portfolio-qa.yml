name: NQ V13 risk robustness and 3-5 strategy portfolio QA
on:
  push:
    paths:
      - 'research/nq/ninjatrader/NQNativeRobustnessV13.cs'
      - 'research/nq/ninjatrader/NQNativePortfolioV13.cs'
      - 'research/nq/ninjatrader/tests/NQNativeRobustnessV13Test.cs'
      - 'research/nq/ninjatrader/tests/NQNativePortfolioV13Test.cs'
      - '.github/workflows/nq-v13-robustness-portfolio-qa.yml'
  pull_request:
    paths:
      - 'research/nq/ninjatrader/NQNativeRobustnessV13.cs'
      - 'research/nq/ninjatrader/NQNativePortfolioV13.cs'
      - 'research/nq/ninjatrader/tests/NQNativeRobustnessV13Test.cs'
      - 'research/nq/ninjatrader/tests/NQNativePortfolioV13Test.cs'
      - '.github/workflows/nq-v13-robustness-portfolio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile V13 1.5x costs, V7 G0 economic gates, moving-block-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v13risk"
          cat > "$RUNNER_TEMP/v13risk/v13risk.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          for file in NQNativeG0RulesV6 NQNativeG0DiagnosticsV7 NQNativeRobustnessV13; do
            cp "research/nq/ninjatrader/${file}.cs" "$RUNNER_TEMP/v13risk/"
          done
          cp research/nq/ninjatrader/tests/NQNativeRobustnessV13Test.cs "$RUNNER_TEMP/v13risk/Program.cs"
          dotnet run --project "$RUNNER_TEMP/v13risk/v13risk.csproj" --configuration Release
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile V13 3-5-strategy diversity, correlation, contribution and overlapping MAE proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v13portfolio"
          cat > "$RUNNER_TEMP/v13portfolio/v13portfolio.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          XML
          for file in NQNativeG0RulesV6 NQNativeG0DiagnosticsV7 NQNativeRobustnessV13 NQNativePortfolioV13; do
            cp "research/nq/ninjatrader/${file}.cs" "$RUNNER_TEMP/v13portfolio/"
          done
          cp research/nq/ninjatrader/tests/NQNativePortfolioV13Test.cs "$RUNNER_TEMP/v13portfolio/Program.cs"
          dotnet run --project "$RUNNER_TEMP/v13portfolio/v13portfolio.csproj" --configuration Release
