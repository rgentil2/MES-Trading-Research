name: NQ V24 100700 complete 36-month M1 economic backtests (capacity proof)
on:
  push:
    paths:
      - '.github/workflows/nq-v24-100k-full-economic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hundred-thousand-full-m1-economic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Build source pinned V11-V24 full V12 fill economic research
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/nq-v24-scale/NQResearchV24.csproj -c Release --nologo
      - name: 100700 FULL 36-month M1 V12 economic GA simulations and replay (no synthetic fitness oracle)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v24_100k"
          dotnet run --project tools/nq-v24-scale/NQResearchV24.csproj --no-build -c Release -- --bench-synthetic36 "$RUNNER_TEMP/v24_100k" 600 183 512 256 | tee "$RUNNER_TEMP/v24_100k_first.log"
          grep 'fullBacktests=100700 journalReused=0' "$RUNNER_TEMP/v24_100k_first.log"
          test "$(wc -l < "$RUNNER_TEMP/v24_100k/v24_economics_ledger.tsv")" -eq 100701
          cp "$RUNNER_TEMP/v24_100k/v24_top_ranking.tsv" "$RUNNER_TEMP/v24_100k_ranking_before.tsv"
          dotnet run --project tools/nq-v24-scale/NQResearchV24.csproj --no-build -c Release -- --bench-synthetic36 "$RUNNER_TEMP/v24_100k" 600 183 512 256 | tee "$RUNNER_TEMP/v24_100k_replay.log"
          grep 'fullBacktests=0 journalReused=100700' "$RUNNER_TEMP/v24_100k_replay.log"
          cmp "$RUNNER_TEMP/v24_100k_ranking_before.tsv" "$RUNNER_TEMP/v24_100k/v24_top_ranking.tsv"
          test "$(wc -l < "$RUNNER_TEMP/v24_100k/v24_economics_ledger.tsv")" -eq 100701
          echo NQ_V24_100700_COMPLETE_36MONTH_ECONOMIC_BACKTESTS_AND_REPLAY_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: nq-v24-100700-complete-36month-economic-benchmark
          path: ${{ runner.temp }}/v24_100k
          retention-days: 7
