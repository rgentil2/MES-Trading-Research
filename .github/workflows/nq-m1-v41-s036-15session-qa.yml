name: NQ S0.36 frozen 12 AST 15 selected IST session order replay synthetic QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-15-session-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas "TA-Lib==0.6.8"
      - name: Full technical regression for enlarged frozen 15-day sample
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m unittest discover -s research/nq -p 'test_nq_m1_v*.py' -q
      - name: Assert original economic hard stop and no holdout
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from research.nq.nq_m1_v22_quality_gate import audit
          g=audit()
          assert g["checks_total"]==13 and g["passed_verified"]==0
          assert g["decision"]=="EXECUTION_BLOCKED"
          print("NQ_S036_15_IST_SESSIONS_EXPLORATORY_ONLY_NOT_G0_10K")
          PY
