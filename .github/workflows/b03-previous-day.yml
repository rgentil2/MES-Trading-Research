name: B03 Previous Day Context

on:
  push:
    branches: [main]
    paths:
      - "research/B03_PREVIOUS_DAY_PRE_REGISTRATION.md"
      - "research/active/B03_PREVIOUS_DAY/**"
      - "tests/test_b03_previous_day.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/b03-previous-day.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_b03_previous_day.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run frozen B03
        env:
          PYTHONPATH: .
        run: python research/active/B03_PREVIOUS_DAY/b03_previous_day.py
      - name: Verify 2026 isolation
        run: |
          python - <<'PY'
          import glob
          import pandas as pd
          for f in glob.glob("results/B03/*.parquet"):
              d=pd.read_parquet(f)
              if d.empty:
                  continue
              if "first_ts" in d.columns:
                  ts=pd.to_datetime(d["first_ts"],utc=True,errors="coerce").dropna().dt.tz_convert("America/New_York")
                  if len(ts):
                      assert ts.dt.year.max()<=2025,(f,ts.dt.year.max())
          print("B03 verified: 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b03-previous-day-results
          path: results/B03/**
          retention-days: 30
