name: NQ T97-T132 Full 36 Member D1 - Pre-registered Multi-resolution DEV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t97-t132-36-d1-full-cohort-dev.yml'
      - 'local_nq_tick_2025_2026/nq_t97_t132_d1_batch.py'
      - 'local_nq_tick_2025_2026/test_nq_t97_t132_d1_batch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-months-full-family-private:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preregistered BH36 + D0 26 diverse (>20) before ALL futures
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T97_T132_D1_WHOLE_COHORT_PREREG_2026_10_12.md
          test -s research/nq/NQ_T97_T132_D0_FROZEN_COUNTS_2026_10_12.json
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t97_t132_d1_batch.py -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t97_t132_d1_batch.py
      - name: Reuse the same SEVEN sha256 verified Last DEV months only, no other source
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/out
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          for MONTH in 2025-10 2025-11 2025-12 2026-01 2026-02 2026-03 2026-04; do
            mkdir -p _private/arc _private/data
            gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
            (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
            7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
            python local_nq_tick_2025_2026/nq_t97_t132_d1_batch.py --root _private/data --month "$MONTH" --out "_private/out/t97_t132_d1_${MONTH}.json"
            rm -rf _private/arc _private/data
          done
      - name: Reconcile 36 D0 masks then bootstrap session blocks B10k and BH36
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t97_t132_d1_batch.py --inputs _private/out --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Delete raw Last and ALL session-level markouts ALWAYS
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t97-t132-36-member-D1-safe-only-aggregates
          path: final/
          if-no-files-found: error
