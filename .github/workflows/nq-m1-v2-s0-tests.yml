name: NQ M1 V2 S0 registry generator and portfolio contracts

on:
  push:
    branches: [main]
    paths:
      - "research/nq/NQ_M1_V2_INDICATOR_CATALOG_2026_10_27.json"
      - "research/nq/nq_m1_v2_generator.py"
      - "research/nq/nq_m1_v2_pipeline.py"
      - "research/nq/test_nq_m1_v2_s0.py"
      - "research/nq/nq_m1_v2_m1_engine.py"
      - "research/nq/test_nq_m1_v2_m1_engine.py"
      - "research/nq/nq_m1_v2_orders.py"
      - "research/nq/test_nq_m1_v2_orders.py"
      - "research/nq/nq_m1_v2_indicators_ext.py"
      - "research/nq/test_nq_m1_v2_indicators_ext.py"
      - "research/nq/nq_m1_v2_batch_preflight.py"
      - "research/nq/test_nq_m1_v2_batch_preflight.py"
      - "research/nq/test_nq_m1_v2_talib_parity.py"
      - "research/nq/nq_m1_v2_ist_engineering_pilot.py"
      - "research/nq/test_nq_m1_v2_ist_engineering_pilot.py"
      - "research/nq/nq_m1_v2_semantic_lint.py"
      - "research/nq/test_nq_m1_v2_semantic_lint.py"
      - "research/nq/nq_m1_v21_semantic_generator.py"
      - "research/nq/test_nq_m1_v21_semantic_generator.py"
      - "research/nq/nq_m1_v21_warmup_context.py"
      - "research/nq/test_nq_m1_v21_warmup_context.py"
      - "research/nq/nq_m1_v21_ist_engineering_pilot.py"
      - "research/nq/test_nq_m1_v21_ist_engineering_pilot.py"
      - "research/nq/nq_m1_v22_contract_provenance.py"
      - "research/nq/test_nq_m1_v22_contract_provenance.py"
      - "research/nq/NQ_M1_V22_PRE_EXECUTION_QUALITY_MATRIX_2026_10_27.json"
      - "research/nq/nq_m1_v22_quality_gate.py"
      - "research/nq/test_nq_m1_v22_quality_gate.py"
      - "research/nq/nq_m1_v22_session_clock_qc.py"
      - "research/nq/test_nq_m1_v22_session_clock_qc.py"
      - "research/nq/nq_m1_v22_account_risk_reference.py"
      - "research/nq/test_nq_m1_v22_account_risk_reference.py"
      - "research/nq/nq_m1_v22_synthetic_d1_d2_checks.py"
      - "research/nq/test_nq_m1_v22_synthetic_d1_d2_checks.py"
      - "research/nq/test_nq_m1_v22_integrated_warmup.py"
      - "research/nq/nq_m1_v22_semantic_fingerprint.py"
      - "research/nq/test_nq_m1_v22_semantic_fingerprint.py"
      - "research/nq/nq_m1_v22_incubator_ma.py"
      - "research/nq/test_nq_m1_v22_incubator_ma.py"
      - "research/nq/nq_m1_v22_tick_first_touch_reference.py"
      - "research/nq/test_nq_m1_v22_tick_first_touch_reference.py"
      - "research/nq/nq_m1_v22_incubator_oscillators.py"
      - "research/nq/test_nq_m1_v22_incubator_oscillators.py"
      - "research/nq/nq_m1_v22_structural_preflight.py"
      - "research/nq/test_nq_m1_v22_structural_preflight.py"
      - "research/nq/NQ_M1_V2_GENERATOR_SPEC_2026_10_27.md"
      - ".github/workflows/nq-m1-v2-s0-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s0-no-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy pandas
      - name: Run V2 S0 synthetic integrity and one-account shadow tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_s0.py -v
      - name: Run synthetic 18-indicator causal M1 execution subset tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_m1_engine.py -v
      - name: Test S0.2 pending orders, trailing and break-even without market data
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_orders.py -v
      - name: Test 20 additional causal indicator scalar formulas S0.3
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_indicators_ext.py -v
      - name: Test broad 132-block versus compatible 38-scalar structural track
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_batch_preflight.py -v
      - name: Produce sealed-year-safe full structural manifest for future IST-only pilot
        env:
          PYTHONPATH: .
        run: python -m research.nq.nq_m1_v2_batch_preflight --broad-count 300 --compatible-target 100 --seed 20261027 --output /tmp/nq_v2_s0_two_track_manifest.json
      - name: Upload structural manifest only; absolutely no OHLC or PnL
        uses: actions/upload-artifact@v4
        with:
          name: nq-m1-v2-s0-300-broad-100-compatible-structural-only
          path: /tmp/nq_v2_s0_two_track_manifest.json
          retention-days: 30
      - name: Install independent TA-Lib reference (test only)
        run: python -m pip install "TA-Lib==0.6.8"
      - name: Verify external TA-Lib numerical parity and causal warmup
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_talib_parity.py -v
      - name: Cross-check isolated NQ DEMA TEMA TRIMA prototypes against TA-Lib
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_incubator_ma.py -v
      - name: Verify independent NQ TRIX APO incubator indicators against TA-Lib
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_incubator_oscillators.py -v
      - name: Test immutable V2 IST pilot and 2025/26 sealed source guards
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v2_ist_engineering_pilot.py -v
      - name: Audit inactive indicator parameters and false search multiplicity S0
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s research/nq -p test_nq_m1_v2_semantic_lint.py -v
          python -m research.nq.nq_m1_v2_semantic_lint > /tmp/nq_v2_semantic_audit.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/nq_v2_semantic_audit.json"))
          assert x["no_market_data"] and not x["formal_gates_run"]
          assert x["candidate_count"] == 100
          print("V2_SEMANTIC_AUDIT_SAFE", {"blocked_candidates":x["blocked_candidates"],"inactive_fields":x["total_fields"].get("inactive_parameter_fields",0)})
          PY
      - name: Verify V2.1 NQ-only semantic thresholds and broad search
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s research/nq -p test_nq_m1_v21_semantic_generator.py -v
          python -m research.nq.nq_m1_v21_semantic_generator --scope broad --count 300 --out /tmp/v21_broad_300.json
          python -m research.nq.nq_m1_v21_semantic_generator --scope engineering --count 100 --out /tmp/v21_engineering_100.json
      - name: Upload NQ-only typed AST search manifests without market outcomes
        uses: actions/upload-artifact@v4
        with:
          name: nq-m1-v21-nq-only-300-broad-100-engineering-AST
          path: |
            /tmp/v21_broad_300.json
            /tmp/v21_engineering_100.json
          retention-days: 30
      - name: Verify NQ V2.1 prior complete RTH session warmup and same-contract roll gates
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v21_warmup_context.py -v
      - name: Freeze NQ V2.1 pilot SHA and test private-stage source guards with mocked bars
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v21_ist_engineering_pilot.py -v
      - name: Verify canonical NQ roll identity and same-contract session windows
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_contract_provenance.py -v
      - name: Test mandatory no-price economic execution release gate
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s research/nq -p test_nq_m1_v22_quality_gate.py -v
          python -m research.nq.nq_m1_v22_quality_gate > /tmp/nq_v22_readiness.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nq_v22_readiness.json'))
          assert x['decision']=='EXECUTION_BLOCKED'
          assert not x['ready_for_economic_execution']
          assert len(x['blocked'])==13 and x['checks_total']==13
          assert x['asset']=='NQ' and x['contracts']==1 and x['holdouts']=='SEALED'
          print("NQ_PRE_ECONOMIC_BLOCK_ACTIVE: 13 mandatory quality gates still pending verification")
          PY
          if python -m research.nq.nq_m1_v22_quality_gate --require-ready > /tmp/nq_guard_expected_block.txt; then
            echo "ERROR: economic gate opened prematurely"; exit 1
          else
            echo "NQ economic execution rejected by mandatory guard as expected"
          fi
      - name: Synthetic independent DST and session-close safety QC
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_session_clock_qc.py -v
      - name: NQ-only reference EOD trailing, soft-pause and floating equity arithmetic QC
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_account_risk_reference.py -v
      - name: Verify D1 and D2 economic validation mathematics on synthetic trades ONLY
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_synthetic_d1_d2_checks.py -v
      - name: Verify NQ same-contract warmup integrated into all OHLC prototype indicators and exits
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_integrated_warmup.py -v
      - name: Verify NQ semantic canonical strategy grouping and false-multiplicity controls
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s research/nq -p test_nq_m1_v22_semantic_fingerprint.py -v
          python - <<'PY'
          from research.nq.nq_m1_v22_semantic_fingerprint import audit_frozen_100
          x=audit_frozen_100()
          assert x['cohort_n']==100 and x['executably_semantic_n']==82
          assert x['economic_metrics'] is None and x['holdouts']=='SEALED'
          print('NQ_SEMANTIC_GROUPS', x['canonical_groups'], 'DUPLICATES', x['duplicate_candidates'])
          PY
      - name: Test independent synthetic first Last-tick barrier-touch order vs pessimistic OHLC policy
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_m1_v22_tick_first_touch_reference.py -v
      - name: Audit executable NQ AST registry parameter domains before future G0 D0 formal parity
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s research/nq -p test_nq_m1_v22_structural_preflight.py -v
          python -m research.nq.nq_m1_v22_structural_preflight > /tmp/nq_v22_structural_preflight.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nq_v22_structural_preflight.json'))
          assert x['market_data_opened'] is False and x['not_legacy_g0_d0_parity']
          assert x['rows']==100 and x['holdouts']=='SEALED'
          print('NQ_PRE_D0_TECHNICAL_ONLY', x['structurally_executable_count'], x['blocked'])
          PY
      - name: Check registered catalog and reproducible candidate batch without market files
        env:
          PYTHONPATH: .
        run: |
          python -m research.nq.nq_m1_v2_generator --mode registry > /tmp/v2registry.json
          python -m research.nq.nq_m1_v2_generator --mode generate --count 100 --seed 20261027 > /tmp/v2candidates.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/v2registry.json'))
          b=json.load(open('/tmp/v2candidates.json'))
          assert a['total']==132
          assert a['holdouts']=='SEALED'
          assert b['count']==100
          assert b['state']=='STRUCTURAL_CANDIDATES_ONLY_NOT_BACKTESTED'
          assert b['holdouts']=='SEALED'
          print("NQ_M1_V2_S0_OK: 132 registry blocks; 100 structural strategies; NO market data.")
          PY
      - name: Confirm formal legacy gates remain unadapted (no misleading pass)
        env:
          PYTHONPATH: .
        run: |
          python -m research.nq.nq_m1_v2_pipeline > /tmp/v2adapters.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v2adapters.json'))
          assert set(p['gate_adapters']) == {'G0','D0','D1','D2'}
          assert all(x['state']=='PENDING_ADAPTER' for x in p['gate_adapters'].values())
          assert p['H2025_H2026']=='SEALED'
          print("V2 fail-closed gate adapter contracts OK; no formal G0-D2 pass claimed")
          PY
      # S0 must never download private NQ archives, market prices, or reserved outcomes.
