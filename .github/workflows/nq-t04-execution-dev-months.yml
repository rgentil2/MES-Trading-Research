name: NQ T04 frozen T02-vs-C02 risk and assumed-cost full DEV (public)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t04-execution-dev-months.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nq-t04-dev-months-${{ github.ref }}
  cancel-in-progress: true

jobs:
  month-portfolio-exploratory:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MONTH: ${{ matrix.month }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic T04 execution/cost assumptions/month security tests
        run: |
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t04_execution.py -v
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t04_month.py -v
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_sim_nq_last_execution_skeleton.py -v
      - name: DEV months whitelist before private market data
        run: |
          python - <<'PY'
          import os
          from nq_tick_short_horizon_month import MONTHS
          if os.environ['MONTH'] not in MONTHS:raise SystemExit('SEALED_OR_OUT_OF_SCOPE')
          print('Allowed T04 exploratory month:',os.environ['MONTH'])
          PY
      - name: Download ONLY private DEV Last with SHA256 verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]];then echo 'Missing DEV-only read key';exit 2;fi
          mkdir -p _nq_private_tmp/archives _nq_private_tmp/extracted
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 \
            --pattern "NQ_${MONTH}_Last.7z.001" \
            --pattern "NQ_${MONTH}_Last.7z.sha256" \
            --dir _nq_private_tmp/archives
          (
            cd _nq_private_tmp/archives
            sha256sum -c "NQ_${MONTH}_Last.7z.sha256"
          )
          if ! command -v 7z >/dev/null 2>&1;then
            sudo apt-get update -qq
            sudo apt-get install -qq -y p7zip-full
          fi
          7z x "_nq_private_tmp/archives/NQ_${MONTH}_Last.7z.001" \
            -y -o_nq_private_tmp/extracted >/dev/null
      - name: Run monthly fixed T02/C02 1-NQ two-trades/day SL/TP and fee stress
        run: |
          python local_nq_tick_2025_2026/nq_t04_month.py \
            --root _nq_private_tmp/extracted --month "$MONTH"
      - name: Remove temporary private licensed data
        if: ${{ always() }}
        run: rm -rf _nq_private_tmp
