name: NQ tick to 1m+5m integrity and synthetic fills (public runner)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-tick-minute-integrity-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nq-tick-minute-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-last:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2025-10-15','2025-12-16','2026-03-09','2026-06-16']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELECTED_DAY: ${{ matrix.day }}
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic 1m and 5m reconstruction and holdout-firewall tests
        run: python -m unittest discover -s local_nq_tick_2025_2026 -p test_qc_tick_to_minutes.py -v
      - name: Synthetic conservative execution-model tests (NO real signals)
        run: python -m unittest discover -s local_nq_tick_2025_2026 -p test_sim_nq_last_execution_skeleton.py -v
      - name: Validate DEV date and weekday before touching private data
        run: |
          python - <<'PY'
          import os
          from qc_tick_day import check_day
          d=check_day(os.environ['SELECTED_DAY'])
          if d.weekday()>=5:raise SystemExit('Weekend is not an allowed session')
          print('Allowed DEV session:',d)
          PY
      - name: Download only Last DEV month, checksum and extract selected day
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then echo 'Missing DEV Contents:Read token';exit 2;fi
          MONTH="${SELECTED_DAY:0:7}"
          TAG="nq-tick-$MONTH"
          mkdir -p _nq_private_tmp/archives _nq_private_tmp/extracted
          gh release download "$TAG" --repo rgentil2/NQ-Ticks-Dev-2026 \
            --pattern "NQ_${MONTH}_Last.7z.001" \
            --pattern "NQ_${MONTH}_Last.7z.sha256" \
            --dir _nq_private_tmp/archives
          (
            cd _nq_private_tmp/archives
            sha256sum -c "NQ_${MONTH}_Last.7z.sha256"
          )
          if ! command -v 7z >/dev/null 2>&1;then
            sudo apt-get update -qq
            sudo apt-get install -qq -y p7zip-full
          fi
          DATE_COMPACT="${SELECTED_DAY//-/}"
          7z x "_nq_private_tmp/archives/NQ_${MONTH}_Last.7z.001" \
            -y -r "*${DATE_COMPACT}*" -o_nq_private_tmp/extracted >/dev/null
      - name: Tick Last to 1m and 5m OHLCV consistency (NO independent minute source)
        run: |
          python local_nq_tick_2025_2026/qc_tick_to_minutes.py \
            --day "$SELECTED_DAY" --root _nq_private_tmp/extracted
      - name: B02 fixed-date Oct15 NQ 12-25 canonical 240-minute digest
        if: matrix.day == '2025-10-15'
        run: |
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_b02_tick_single_day_digest.py -v
          python local_nq_tick_2025_2026/nq_b02_tick_single_day_digest.py \
            --root _nq_private_tmp/extracted \
            --out _safe_b02_digest/nq_tick_20251015_sha256.json
      - name: Remove private raw ticks from runner
        if: ${{ always() }}
        run: rm -rf _nq_private_tmp
