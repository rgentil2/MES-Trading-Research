name: NQ Strategy Builder 50K V1 - synthetic tests only
on:
  push:
    branches:
      - exploratory/strategy-builder-50k-v1-20261014
    paths:
      - research/strategy_builder_50k/**
      - .github/workflows/nq-strategy-builder-50k-v1-tests.yml
  workflow_dispatch:
jobs:
  synthetic-unit-tests-no-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/strategy_builder_50k/requirements.txt
      - run: python -m compileall -q research/strategy_builder_50k
      - run: python -m unittest discover -s research/strategy_builder_50k/tests -v
