name: Build R072 engine parity reference

on:
  push:
    branches: [main]
    paths:
      - 'research/build_r072_engine_reference.py'
      - '.github/workflows/build-r072-engine-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow pyyaml scipy statsmodels
      - run: python research/build_r072_engine_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: r072-engine-reference
          path: results/r072_engine_reference/*
          if-no-files-found: error
