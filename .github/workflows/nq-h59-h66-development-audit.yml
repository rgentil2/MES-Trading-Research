name: NQ H59-H66 deductive study official eight-member audit
on:
  push:
    branches: [main]
    paths:
      - "results/development/nq_h59_h66_family.json"
      - ".github/workflows/nq-h59-h66-development-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-and-holm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Ensure original source and eight definitions still immutable
        run: python tools/research_governance.py --preflight-family NQ-PARENT-INTERACTIONS-H59-H66-V1
      - name: Verify full-family Holm adjustment on development-only report
        run: python tools/research_governance.py --evaluate-family NQ-PARENT-INTERACTIONS-H59-H66-V1
      - name: Run ten synthetic controls of overlap, causal timing and cost
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/nq -p test_nq_h59_h66_parent_interactions.py -v
