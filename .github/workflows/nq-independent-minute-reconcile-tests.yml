name: NQ independent Minute Last reconciliation synthetic tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-independent-minute-reconcile-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-only-no-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only reconciliation tests, strict DST and holdout guards
        env:
          PYTHONPATH: local_nq_tick_2025_2026
        run: python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_compare_independent_nq_minutes.py' -v
      - name: Previously validated Tick Last to 1m/5m source and execution-model tests
        env:
          PYTHONPATH: local_nq_tick_2025_2026
        run: |
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_qc_tick_to_minutes.py' -v
          python -m unittest discover -s local_nq_tick_2025_2026 -p 'test_sim_nq_last_execution_skeleton.py' -v
