name: H081 MS2 Heterogeneity Audit

on:
  push:
    branches: [main]
    paths:
      - 'research/temporal/H081_MS2_HETEROGENEITY_PROTOCOL.md'
      - 'research/temporal/H081_MS2_HETEROGENEITY_FREEZE.json'
      - 'tools/audit_h081_ms2_heterogeneity.py'
      - '.github/workflows/h081-ms2-heterogeneity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  heterogeneity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen files before artifact access
        run: |
          python - <<'PY'
          import json, subprocess
          lock=json.load(open('research/temporal/H081_MS2_HETEROGENEITY_FREEZE.json'))
          assert lock['frozen_before_join'] is True
          assert lock['strategy_modification_permitted'] is False
          assert lock['calendar_2026_opened'] is False
          for path, expected in lock['fingerprints'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('PASS: H081 x MES-MS2 freeze verified before artifact access')
          PY

      - name: Download exact archived H081 artifact
        uses: actions/download-artifact@v4
        with:
          name: b14-opposite-sign-candidates
          path: inputs/B14
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36427711138

      - name: Download exact frozen MES-MS2 artifact
        uses: actions/download-artifact@v4
        with:
          name: mes-market-state-v2-2020-2024
          path: inputs/MS2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37391057933

      - name: Install analysis dependencies
        run: pip install numpy pandas pyarrow

      - name: Run frozen heterogeneity audit
        run: |
          python tools/audit_h081_ms2_heterogeneity.py             --h081-dir inputs/B14             --ms2-dir inputs/MS2

      - uses: actions/upload-artifact@v4
        with:
          name: h081-ms2-heterogeneity-audit
          path: results/temporal/H081_MS2/**
          if-no-files-found: error
