name: NQ T97-T132 Six Block Multi-resolution 233-377-4181 D0 DEV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nq-t97-t132-multiscale-36-d0-dev.yml'
      - 'research/nq/NQ_T97_T132_SIX_BLOCKS_D0_PREREG_2026_10_12.json'
      - 'local_nq_tick_2025_2026/nq_t97_t132_d0_features.py'
      - 'local_nq_tick_2025_2026/nq_t97_t132_d0_batch.py'
      - 'local_nq_tick_2025_2026/test_nq_t97_t132_d0_batch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prereg-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify freeze before D0 observations and synthetic atomics
        run: |
          set -euo pipefail
          test -s research/nq/NQ_T97_T132_SIX_BLOCKS_D0_PREREG_2026_10_12.json
          test -s research/nq/NQ_T97_T132_SIX_BLOCKS_D0_PREREG_2026_10_12.md
          python -m unittest discover -s local_nq_tick_2025_2026 -p test_nq_t97_t132_d0_batch.py -v
          python -m compileall -q local_nq_tick_2025_2026/nq_t97_t132_d0_features.py local_nq_tick_2025_2026/nq_t97_t132_d0_batch.py
  months:
    needs: prereg-test
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        month: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04']
    env:
      PYTHONPATH: local_nq_tick_2025_2026
      MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse EXISTING DEV Last SHA256 verified only
        env:
          GH_TOKEN: ${{ secrets.NQ_DEV_TICKS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _private/arc _private/data
          gh release download "nq-tick-$MONTH" --repo rgentil2/NQ-Ticks-Dev-2026 --pattern "NQ_${MONTH}_Last.7z.001" --pattern "NQ_${MONTH}_Last.7z.sha256" --dir _private/arc
          (cd _private/arc && sha256sum -c "NQ_${MONTH}_Last.7z.sha256")
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y p7zip-full)
          7z x "_private/arc/NQ_${MONTH}_Last.7z.001" -y -o_private/data >/dev/null
      - name: Atomic 36-feature multi-resolution D0, no outcomes
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t97_t132_d0_batch.py --root _private/data --month "$MONTH" --out "safe/t97_t132_d0_${MONTH}.json"
      - name: Erase licensed Last ALWAYS
        if: always()
        run: rm -rf _private
      - uses: actions/upload-artifact@v4
        with:
          name: t97-t132-d0-safe-month-${{ matrix.month }}
          path: safe/t97_t132_d0_*.json
          if-no-files-found: error
  aggregate:
    needs: months
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: local_nq_tick_2025_2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: t97-t132-d0-safe-month-*
          merge-multiple: true
          path: _monthly
      - name: Check EXACT 140/135 and family 36, Jaccard and >=20 D0 diverse gate
        run: |
          set -euo pipefail
          python local_nq_tick_2025_2026/nq_t97_t132_d0_batch.py --inputs _monthly --out final/summary.json --report final/report.md
          cat final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nq-t97-t132-six-blocks-multiscale-D0-safe-no-outcomes
          path: final/
          if-no-files-found: error
