name: R005 Morning ORB research
on:
  push:
    branches: [main]
    paths:
      - "research/active/R005_MORNING_ORB/**"
      - "src/research_utils.py"
      - "tests/test_r005_morning_orb.py"
      - "src/data_pipeline.py"
      - "data/raw/**"
      - "config/settings.yaml"
      - "requirements.txt"
      - ".github/workflows/r005-morning-orb.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_r005_morning_orb.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run R005
        env:
          PYTHONPATH: .
        run: python research/active/R005_MORNING_ORB/r005_morning_orb.py --start 2020-01-01 --end 2024-12-31 --output-dir results/R005/development_2020_2024
      - name: Verify isolation and cutoff
        run: |
          python - <<'PY'
          import pandas as pd
          e=pd.read_parquet("results/R005/development_2020_2024/events.parquet")
          ts=pd.to_datetime(e["timestamp_et"],utc=True).dt.tz_convert("America/New_York")
          assert ts.dt.year.max() <= 2024
          assert (ts.dt.hour*60+ts.dt.minute).max() <= 690
          print("R005 checks verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r005-morning-orb-development-2020-2024
          path: |
            results/R005/development_2020_2024/primary_hypotheses.csv
            results/R005/development_2020_2024/yearly_stability.csv
            results/R005/development_2020_2024/events.parquet
          retention-days: 30
