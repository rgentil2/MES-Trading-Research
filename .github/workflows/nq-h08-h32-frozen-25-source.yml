name: NQ H08-H32 frozen 25 minute hypotheses — preflight and unit tests
on:
  push:
    branches: [main]
    paths:
      - "research/nq/NQ_H08_H32_MINUTE_25_PREREG_2026_10_09.md"
      - "research/nq/nq_h08_h32_minute_2020_2024.py"
      - "research/nq/test_nq_h08_h32_minute_2020_2024.py"
      - "research/SEARCH_LEDGER.json"
      - "research/SEARCH_FAMILY_FREEZES.json"
      - "results/development/nq_h08_h32_minute_family.json"
      - ".github/workflows/nq-h08-h32-frozen-25-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-nq-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Hard-check all 25 preregistrations and dependency hashes BEFORE outcomes
        run: python tools/research_governance.py --preflight-family NQ-MINUTE-25-H08-H32-V1
      - name: Six tests for NQ 1m causality, 25-way correction, fees and 2025/2026 firewall
        run: python -m unittest discover -s research/nq -p test_nq_h08_h32_minute_2020_2024.py -v
      - name: Evaluate nonrecyclable Holm family only after report is published
        run: |
          if [ -f results/development/nq_h08_h32_minute_family.json ]; then
            python tools/research_governance.py --evaluate-family NQ-MINUTE-25-H08-H32-V1
          else
            echo 'Frozen H08-H32 family has no published outcome yet; no market data loaded.'
          fi
