name: B10 Regime Decay

on:
  push:
    branches: [main]
    paths:
      - "research/B10_REGIME_DECAY_PRE_REGISTRATION.md"
      - "research/active/B10_REGIME_DECAY/**"
      - "tests/test_b10_regime_decay.py"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - ".github/workflows/b10-regime-decay.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_data_pipeline.py tests/test_b10_regime_decay.py
      - name: Build dataset
        run: python -m src.data_pipeline
      - name: Run frozen B10
        env:
          PYTHONPATH: .
        run: python research/active/B10_REGIME_DECAY/b10_regime_decay.py
      - name: Verify 2026 isolation
        run: |
          python - <<'PY'
          import pandas as pd
          for f in ["results/B10/blocks.parquet","results/B10/events.parquet"]:
              d=pd.read_parquet(f)
              if len(d):
                  ts=pd.to_datetime(d["block_end_ts"],utc=True).dt.tz_convert("America/New_York")
                  assert ts.dt.year.max()<=2025,(f,ts.dt.year.max())
          print("B10 verified: 2026 unopened.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b10-regime-decay
          path: results/B10/**
          retention-days: 30
